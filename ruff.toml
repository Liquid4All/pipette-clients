# Ruff config for the repo's Python. py312 matches DEFAULT_PYTHON_VERSION, the
# venv pipette-artifacts provisions for mlx. CI's python-check job runs
# `ruff check .` and `ruff format --check .`.
target-version = "py312"

# Vendored / generated trees are not ours to lint.
extend-exclude = [
    "ios/vendor",
    "vendor",
    "**/.venv",
    "**/venv",
]

[lint]
select = ["E", "F", "I", "B", "UP", "W"]
