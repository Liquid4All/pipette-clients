# cargo-deny gates for the Rust workspace: licenses, advisories, bans, sources.
#
# Run locally with `cargo deny check licenses advisories bans sources`. In CI,
# build.yml runs `check licenses`; security.yml runs the rest on every PR and a
# daily cron, because a new advisory lands against an unchanged tree and the
# `rust` path filter would hide it.
#
# Needs cargo-deny 0.19+: older builds abort on any advisory with a CVSS 4.0
# vector ("unsupported CVSS version: 4.0"). CI pins it in ci/install-tool.sh.
#
# ci/android-licenses.py holds the Android allow-list; change the two together
# (docs/licensing.md).

[graph]
# Every target the clients build for, so cfg(target_os = ...) dependencies count.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-linux-android",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# So a license can't slip in behind a feature the default build leaves off.
all-features = true

[licenses]
# An allow-list, so a new copyleft dependency turns CI red without anyone having
# predicted its SPDX id.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # MPL-2.0 is per file, so it reaches only the dependency's own sources even
    # when statically linked. (L)GPL would reach ours, so none is allowed.
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
    "BSD-1-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0", # webpki-roots, webpki-root-certs
    "ISC",
]

# The allow-list is policy, so it may name licenses no crate carries today
# (BSD-1-Clause, BSD-2-Clause, CC0-1.0, MPL-2.0). Without this each would warn
# `license-not-encountered` on every run, and an always-warning gate goes unread.
unused-allowed-license = "allow"

# No `exceptions` needed: r-efi (`MIT OR Apache-2.0 OR LGPL-2.1-or-later`, and
# UEFI-only) resolves to MIT. No `[[clarify]]`: every crate declares a license.

# The `pipette-*` members carry no `license` field and are `publish = false`,
# which is what this keys off.
[licenses.private]
ignore = true

# The database is fetched at check time, so a new advisory can turn `main` red
# with no change here; a red advisories step is often not the PR's doing.
[advisories]
# A yank is usually the author withdrawing a broken or compromised version.
yanked = "deny"

# "all" includes transitive crates; an unfixable one needs an explicit `ignore`.
unmaintained = "all"

# Only crates.io, plus the mgmt repo for `pipette-plan-types`. Both keys default
# to "warn", which exits 0: with a git dependency on a fork, cargo-deny 0.20.2
# reports "sources ok" under the defaults and "sources FAILED" with these.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/Liquid4All/pipette-mgmt"]

[bans]
# A "warn" exits 0, so duplicates deny. Each `skip` is an older version upstream
# still pins; CI denies `unnecessary-skip` and `unmatched-skip`, so an entry
# fails once that version leaves the graph.
multiple-versions = "deny"
skip = [
    # ring's move to 0.4 is unreleased; aws-lc-rs instead adds a C/cmake build per target.
    { crate = "getrandom@0.2", reason = "ring 0.17 still uses 0.2; tempfile, uuid and the workspace are on 0.4" },
    # No macro crate below has a syn 3 release yet; build-time only.
    { crate = "syn@2", reason = "derive macros not yet on syn 3: jni, nutype, rstest, strum, tabled, tracing and more" },
]
# Only pipette-cli may depend on a runtime crate, dev-dependencies included, so
# a change to one runtime cannot reach another. `ci/checks/runtime-crates.py`
# requires this list to name exactly its runtime crates.
deny = [
    { crate = "pipette-llamacpp", wrappers = ["pipette-cli"], reason = "only pipette-cli may use a runtime crate" },
    { crate = "pipette-mlx", wrappers = ["pipette-cli"], reason = "only pipette-cli may use a runtime crate" },
    { crate = "pipette-coreai", wrappers = ["pipette-cli"], reason = "only pipette-cli may use a runtime crate" },
    { crate = "pipette-onnx-genai", wrappers = ["pipette-cli"], reason = "only pipette-cli may use a runtime crate" },
    { crate = "pipette-openvino", wrappers = ["pipette-cli"], reason = "only pipette-cli may use a runtime crate" },
    { crate = "pipette-ovms", wrappers = ["pipette-cli"], reason = "only pipette-cli may use a runtime crate" },
    { crate = "pipette-torch-oai", wrappers = ["pipette-cli"], reason = "only pipette-cli may use a runtime crate" },
    { crate = "pipette-trt-edgellm", wrappers = ["pipette-cli"], reason = "only pipette-cli may use a runtime crate" },
]
