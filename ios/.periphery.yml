# Periphery unused-code scanner for the Pipette iOS app. Run from ios/: `periphery scan`.
# CI runs it weekly, report-only (.github/workflows/ios-deadcode.yml).
project: Pipette/Pipette.xcodeproj
schemes:
  - Pipette
targets:
  - Pipette
# SwiftUI previews look unused to static analysis but are not.
retain_swift_ui_previews: true
# An app target: `public` is no reason to keep a declaration.
retain_public: false
# Simulator, unsigned, as the ios-check build. CI pre-builds the llama static lib
# and sets PIPETTE_SKIP_BUILD_LLAMA=1 so the in-Xcode phase is skipped.
build_arguments:
  - -destination
  - "platform=iOS Simulator,name=iPhone 17,OS=latest"
  - -skipPackagePluginValidation
  - -skipMacroValidation
  - CODE_SIGNING_ALLOWED=NO
  - ARCHS=arm64
  - ONLY_ACTIVE_ARCH=YES
