			shellScript = "# Upload dSYMs to Sentry so iOS crash reports are symbolicated. Runs only on dSYM-\n# producing configs (Release) and only when sentry-cli + a token (SENTRY_AUTH_TOKEN env\n# or ~/.sentryclirc) are available. Best-effort: a Sentry-side failure (bad token, outage)\n# warns but never fails the build - the iOS counterpart of Android's token-gated upload.\nif [ \"$DEBUG_INFORMATION_FORMAT\" != \"dwarf-with-dsym\" ]; then\n  echo \"note: no dSYM for this configuration - skipping Sentry dSYM upload\"\n  exit 0\nfi\nif [ \"$(uname -m)\" = \"arm64\" ]; then export PATH=\"/opt/homebrew/bin:$PATH\"; fi\nif ! command -v sentry-cli >/dev/null 2>&1; then\n  echo \"warning: sentry-cli not installed - skipping Sentry dSYM upload (https://github.com/getsentry/sentry-cli)\"\n  exit 0\nfi\nif [ -z \"${SENTRY_AUTH_TOKEN:-}\" ] && [ ! -f \"$HOME/.sentryclirc\" ]; then\n  echo \"warning: no SENTRY_AUTH_TOKEN or ~/.sentryclirc - skipping Sentry dSYM upload\"\n  exit 0\nfi\nexport SENTRY_ORG=liquid-ai\nexport SENTRY_PROJECT=pipette-client-ios\n# Let sentry-cli stream its own output to the build log (success and failure both\n# visible), and degrade a non-zero exit to a non-fatal warning so a Sentry-side\n# hiccup never fails the build.\nif ! sentry-cli debug-files upload \"$DWARF_DSYM_FOLDER_PATH\"; then\n  echo \"warning: Sentry dSYM upload failed (non-fatal) - see the sentry-cli output above for the reason\"\nfi\n";
