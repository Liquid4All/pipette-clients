# Example plan: OpenVINO IR on an Intel Lunar Lake box (Core Ultra 7 258V, Arc
# 140V iGPU, AI Boost NPU, Windows 11), on CPU, iGPU and NPU through both
# OpenVINO engines at release 2026.4: `uv_openvino` (`openvino-genai` in a uv
# venv) and `ovms` (OpenVINO Model Server). The two engines are different
# runtime types, so one variant carries both engines' flag rows. See
# docs/ovms.md.
#
# Models come from the private repo LiquidAI/openvino-experimental, laid out as
# <Model>/<precision>/, which is what `prefix` addresses. Set PIPETTE_HF_TOKEN
# on the runner; it is injected at the run boundary. These entries must stay in
# structural form because an `openvino://` URI cannot carry a token.
#
# Variants run smallest model first. For first bring-up pass `--limit` so only
# the first 230M CPU cells run. 240 cells, 120 per engine.
#
# Precision follows the device: NPU rows take the symmetric exports because
# `int4-asym-gq128` fails to compile on the NPU and `int8-asym` runs about 8x
# slower there. `int8-sym` on the NPU returns incoherent output, so read that
# row as timing only. docs/openvino-ir.md has the measurements.
#
# The NPU's static-shape settings are derived per cell by each engine's
# `flags.rs`: `MIN_RESPONSE_LEN` is raised for `end_to_end_latency_512_256`, and
# `MAX_PROMPT_LEN` stays at 1024, which every 512-token prompt here fits. A
# cell over it is rejected because raising it costs compile time
# superlinearly. A cell may still author `max_prompt_len`, `min_response_len`
# or `generate_hint`. The ovms rows leave `prefix_caching` unset, which
# resolves to off.
#
# The MoE models have no NPU path per OpenVINO's support matrix, so they appear
# in no NPU variant. LFM2-24B-A2B is a 12 GB IR on 31.6 GiB of memory shared
# with the iGPU: it fits, but expect its GPU rows to struggle.

plan_id = "intel-openvino"
benchmarks = [
  "prefill_throughput_512",
  "decode_throughput_512_100",
  "end_to_end_latency_512_256",
  "max_memory_usage_512",
]

[[transports]]
client_id   = "intel-node-1"
type        = "ssh"
host        = "intel-node-1"
user        = "eval"
binary_path = "C:/pipette/pipette.exe"
work_dir    = "C:/pipette"
shell       = "powershell"

[retry]
max_consecutive_failures = 5

# --- LFM2.5-230M (151 MB int4) ---------------------------------------------

[[variants]]
clients = ["intel-node-1"]
models = [
  { type = "openvino", source = "huggingface", org = "LiquidAI", repo_name = "openvino-experimental", prefix = "LFM2.5-230M/int4-asym-gq128" },
]
runtimes = [
  { type = "uv_openvino", server_version = "2026.4.1", python_version = "3.11", source = { type = "pip_requirements_text", contents = "numpy==2.4.6\nopenvino==2026.4.1\nopenvino-genai==2026.4.1.0\nopenvino-telemetry==2025.2.0\nopenvino-tokenizers==2026.4.1.0\n" } },
  { type = "ovms", source = "github_release", repository_url = "github.com/openvinotoolkit/model_server", repository_version = "v2026.4.1", flavor = "windows-x64" },
