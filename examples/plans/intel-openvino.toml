# --------------------------------------------------------------------------
# LFM2.5-350M — 211 MB int4. The precision sweep, and the widest block on
# purpose: 350M is cheap to run and it is the model Intel published perf figures
# for, so it is the only one producing numbers comparable to an external
# reference. Those sheets are Panther Lake and devcloud is Lunar Lake, so the
# comparison is shape-for-shape, not row-for-row.
# --------------------------------------------------------------------------
