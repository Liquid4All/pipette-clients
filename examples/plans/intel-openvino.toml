{ type = "uv_openvino", server_version = "2026.2.1", python_version = "3.11", source = { type = "pip_requirements_text", contents = "numpy==2.4.6\nopenvino==2026.2.1\nopenvino-genai==2026.2.1.0\nopenvino-telemetry==2025.2.0\nopenvino-tokenizers==2026.2.1.0\n" } },
