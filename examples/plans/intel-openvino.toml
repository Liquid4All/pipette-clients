]
runtime_flags = [
  { benchmark_type = "prefill_throughput", runtime_type = "uv_openvino", model_type = "openvino", device = "gpu" },
  { benchmark_type = "decode_throughput", runtime_type = "uv_openvino", model_type = "openvino", device = "gpu" },
  { benchmark_type = "end_to_end_latency", runtime_type = "uv_openvino", model_type = "openvino", device = "gpu" },
  { benchmark_type = "max_memory_usage", runtime_type = "uv_openvino", model_type = "openvino", device = "gpu" },
]

