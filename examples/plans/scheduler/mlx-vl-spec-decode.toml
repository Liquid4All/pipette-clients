# The spec-decoding pair: speculation on. The drafter repo is gated, so a
# claiming client needs `PIPETTE_HF_TOKEN` in its environment.
[[variants]]
clients = ["ev1_9f2c1d3e4b5a6c7d"]
models = [
  { type = "mlx_speculative", target = { source = "huggingface", org = "example-org", repo_name = "VLM-3B-MLX-bf16" }, draft = { source = "huggingface", org = "example-org", repo_name = "VLM-3B-Draft-MLX" } },
]
runtime_flags = [
  { benchmark_type = "vl_spec_decode", runtime_type = "mlx_macos_pipette", model_type = "mlx_speculative", speculative_enabled = true },
]
benchmark_flags = [
  { benchmark_type = "vl_spec_decode", runtime_type = "mlx_macos_pipette", model_type = "mlx_speculative", http_timeout_seconds = 600, bench_timeout_seconds = 10800 },
]
