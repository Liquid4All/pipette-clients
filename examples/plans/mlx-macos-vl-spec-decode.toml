# The spec-decoding pair: speculation on. The draft length comes from the
# benchmark's `parameter_draft_length`, and the drafter from the model.
[[variants]]
clients = ["mac-m4-max"]
models = [
  { type = "mlx_speculative", target = { source = "huggingface", org = "example-org", repo_name = "VLM-3B-MLX-bf16" }, draft = { source = "huggingface", org = "example-org", repo_name = "VLM-3B-Draft-MLX" } },
]
runtime_flags = [
  { benchmark_type = "vl_spec_decode", runtime_type = "mlx_macos_pipette", model_type = "mlx_speculative", speculative_enabled = true },
]
benchmark_flags = [
  { benchmark_type = "vl_spec_decode", runtime_type = "mlx_macos_pipette", model_type = "mlx_speculative", http_timeout_seconds = 600 },
]
