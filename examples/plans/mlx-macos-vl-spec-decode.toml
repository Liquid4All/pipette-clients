# Example plan: the VL spec-decode benchmark on MLX.
#
# The MLX twin of llamacpp-macos-vl-spec-decode.toml: the same six MMSpec
# datasets through `mlx_vlm.server`, once with the regular model (speculation
# off) and once with the spec-decoding pair (speculation on). The speedup is
# computed outside the management server from the stored rows, never by a
# client.
#
# `speculative_enabled` is the only MLX runtime flag, and only on this
# benchmark: `mlx_vlm.server` runs with fixed arguments, so whether the drafter
# loads is the plan's one choice. Unset, it follows the model.
#
# `mlx_speculative` names two repositories because an MLX drafter is a bundle
# with its own `config.json`, which `mlx_vlm`'s `load_drafter` reads. The
# drafter repo is gated: export `PIPETTE_HF_TOKEN` on the client, or its fetch
# 404s.
#
# The benchmark ids are the management server's: its catalog serves the corpus
# and there is no local form of this benchmark, so run `pipette sync` first. The
# `_k8` suffix is `parameter_draft_length`; the catalog also publishes k7 and
# k9, and listing those in both variants sweeps the draft length.

plan_id = "mlx-macos-vl-spec-decode-example"
benchmarks = [
  "vl_spec_decode_mmspec_test_gqa_k8",
  "vl_spec_decode_mmspec_test_textvqa_k8",
  "vl_spec_decode_mmspec_test_charxiv_k8",
  "vl_spec_decode_mmspec_test_mmmu_pro_k8",
  "vl_spec_decode_mmspec_test_coco_k8",
  "vl_spec_decode_mmspec_test_multi_turn_k8",
]

[[transports]]
client_id   = "mac-m4-max"
type        = "local"
binary_path = "/Users/pipette/bin/pipette"
work_dir    = "/Users/pipette/edge-evals"
shell       = "posix"

[retry]
max_consecutive_failures = 2


# The regular model: speculation off.
[[variants]]
clients = ["mac-m4-max"]
models = [
  { type = "mlx", source = "huggingface", org = "example-org", repo_name = "VLM-3B-MLX-bf16" },
]
runtime_flags = [
  { benchmark_type = "vl_spec_decode", runtime_type = "mlx_macos_pipette", model_type = "mlx", speculative_enabled = false },
]
benchmark_flags = [
  { benchmark_type = "vl_spec_decode", runtime_type = "mlx_macos_pipette", model_type = "mlx", http_timeout_seconds = 600 },
]
# Spelled out rather than referenced by catalog key so the plan carries the
# environment it measured; `version` only labels what `source.contents` pins.
# The body is the `0.7.4` row of
# crates/pipette-artifacts-catalog/bundled-catalog/mlx/catalog.toml verbatim.
[[variants.runtimes]]
type = "mlx_macos_pipette"
version = "0.7.4"
flavor = "macos-arm64"

