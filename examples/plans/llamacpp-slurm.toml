# Example plan: llama.cpp cells dispatched as SLURM jobs. Each cell is its own
# blocking `srun`, and `parallelism = 8` holds up to 8 at once.
#
# One `pipette-ctl run` process owns every allocation: if it dies (logout, ssh
# drop) the jobs die with it, so run it under tmux or nohup. scripts/slurm/
# (shard + sbatch) has no long-lived driver.

plan_id = "llamacpp-slurm-example"
benchmarks = ["eval_smoke"]

# pipette-ctl runs on the login node. Its non-login `sh -c` does not source the
# profile that puts `srun` on PATH, so `pre_exec` does. Use POSIX `.`, not
# `source`: that `sh` may be dash.
[[transports]]
client_id       = "cluster-login"
type            = "slurm_local"
binary_path     = "/home/eval/pipette/pipette"
work_dir        = "/home/eval/pipette"
shell           = "posix"
pre_exec        = ". /etc/profile.d/modules.sh && module load slurm"
partition       = "defq"
gpus            = 1
cpus            = 8
time_limit      = "02:00:00"
mem             = "32G"
# Per-job `--output`/`--error` files (`%x-%j`) in this directory, relative to
# where `srun` runs; omit it to stream task output to the driver.
log_dir         = "slurm-logs"
parallelism     = 8

# Alternative: drive the cluster from a box that is not the login node, which
# runs `srun` on `host` over ssh. `pre_exec` runs there and is required because
# non-interactive ssh skips the login profile.
#
# [[transports]]
# client_id     = "cluster-over-ssh"
# type          = "slurm_over_ssh"
# host          = "headnode"
# user          = "eval"
# port          = 22
# binary_path   = "/home/eval/pipette/pipette"
# work_dir      = "/home/eval/pipette"
# shell         = "posix"
# pre_exec      = ". /etc/profile.d/modules.sh && module load slurm"
# partition     = "defq"
# gpus          = 1
# cpus          = 8
# time_limit    = "02:00:00"
# mem           = "32G"
# extra_srun_args = ["--exclusive"]
# parallelism   = 8

[retry]
max_consecutive_failures = 5

[[variants]]
clients = ["cluster-login"]
models = [
  { type = "gguf_text", source = "huggingface", org = "unsloth", repo_name = "Qwen3.5-0.8B-GGUF", path = "Qwen3.5-0.8B-Q4_0.gguf" },
  { type = "gguf_text", source = "huggingface", org = "LiquidAI", repo_name = "LFM2.5-350M-GGUF", path = "LFM2.5-350M-Q4_K_M.gguf" },
]
runtimes = [
  { type = "llamacpp_cli_stock_tools", source = "github_release", repository_url = "github.com/ggml-org/llama.cpp", repository_version = "b9050", flavor = "linux-x64-vulkan" },
]
benchmark_flags = [
  { benchmark_type = "eval", runtime_type = "llamacpp_cli_stock_tools", model_type = "gguf_text", http_timeout_seconds = 600 },
]
