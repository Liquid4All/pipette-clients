# Example plan: llama.cpp vision-language benchmarks on Android. A
# `gguf_vision` entry names both the weights and the projector (`mmproj`).

plan_id = "llamacpp-android-vl-example"
benchmarks = [
  "vl_throughput_256x256_32_128",
  "vl_throughput_512x512_32_128",
  "vl_throughput_1056x1056_32_128",
]

[[transports]]
client_id   = "android-a"
type        = "adb"
serial      = "R5CY80M8ZZK"
binary_path = "/data/local/tmp/pipette/pipette"
work_dir    = "/data/local/tmp/pipette"
shell       = "posix"

[retry]
max_consecutive_failures = 5

[[variants]]
clients = ["android-a"]
models = [
  { type = "gguf_vision", source = "huggingface", org = "LiquidAI", repo_name = "LFM2.5-VL-450M-GGUF", model = "LFM2.5-VL-450M-Q4_0.gguf", mmproj = "mmproj-LFM2.5-VL-450m-Q8_0.gguf" },
  { type = "gguf_vision", source = "huggingface", org = "LiquidAI", repo_name = "LFM2.5-VL-450M-GGUF", model = "LFM2.5-VL-450M-Q4_K_M.gguf", mmproj = "mmproj-LFM2.5-VL-450m-Q8_0.gguf" },
]
runtimes = [
  { type = "llamacpp_cli_stock_tools", source = "github_release", repository_url = "github.com/ggml-org/llama.cpp", repository_version = "23dff81c4", flavor = "android-arm64-v8a" },
]
runtime_flags = [
  { benchmark_type = "vl_throughput", runtime_type = "llamacpp_cli_stock_tools", model_type = "gguf_vision", threads = 4 },
]
