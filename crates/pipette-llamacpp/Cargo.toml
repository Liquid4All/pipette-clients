[package]
name = "pipette-llamacpp"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

# Fake llama-server for the integration tests, found through
# `env!("CARGO_BIN_EXE_fake_llama_server")` in `tests/common`.
[[bin]]
name = "fake_llama_server"
path = "tests/bin/fake_llama_server.rs"
test = false
bench = false
doc = false

[dependencies]
anyhow.workspace = true
base64.workspace = true
pipette-completions.workspace = true
pipette-http.workspace = true
pipette-memprobe.workspace = true
pipette-vl-spec-decode-corpus.workspace = true
pipette-ops.workspace = true
pipette-subprocess.workspace = true
pipette-plan-types.workspace = true
hex.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
strum.workspace = true
# The calibration clip, under a name no other user of the temp dir can predict.
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true

# `getpwuid_r`, for the home directory llama.cpp falls back to.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
minijinja.workspace = true
rstest.workspace = true
tar.workspace = true
uuid.workspace = true
