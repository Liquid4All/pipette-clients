[package]
name = "pipette-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "pipette"
path = "src/bin/pipette.rs"
# No tests of its own. Without this cargo builds a harness that links a second
# copy of the lib, which the coverage report counts as uncovered.
test = false
bench = false

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
pipette-artifacts.workspace = true
pipette-artifacts-catalog.workspace = true
pipette-device.workspace = true
pipette-llamacpp.workspace = true
pipette-torch-oai.workspace = true
pipette-http.workspace = true
pipette-mgmt-client.workspace = true
pipette-ops.workspace = true
pipette-readiness.workspace = true
pipette-subprocess.workspace = true
pipette-programs.workspace = true
pipette-wait.workspace = true
pipette-mlx.workspace = true
pipette-coreai.workspace = true
pipette-onnx-genai.workspace = true
pipette-openvino.workspace = true
pipette-ovms.workspace = true
pipette-trt-edgellm.workspace = true
pipette-plan-types.workspace = true
pipette-workspace.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
tabled.workspace = true
thiserror.workspace = true
time.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
pipette-programs = { workspace = true, features = ["test-support"] }
httpmock.workspace = true
rstest.workspace = true
tempfile.workspace = true
