[package]
name = "pipette-device"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Host identity, power, and thermal probes shared by the pipette client crates."

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true

pipette-plan-types.workspace = true

# SoC die temperature via the private IOHID thermal sensors (see die_temp.rs).
# CoreFoundation's retain/release rules are where hand-rolled FFI goes wrong,
# so the typed wrappers earn their place over another `extern "C"` block.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true
libc.workspace = true

# `posix_fadvise`, to drop a model store's page cache (page_cache.rs).
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc.workspace = true

# PDH and `D3DKMTQueryAdapterInfo`: the per-rep readings and the gate's GPU
# temperature.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
rstest.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
