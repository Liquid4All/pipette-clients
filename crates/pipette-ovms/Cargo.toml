[package]
name = "pipette-ovms"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

# Not gated at compile time: the release archives cover Windows and Linux. The
# client refuses any other OS before download (`pipette-cli`'s
# `refuse_foreign_os`).
[dependencies]
anyhow.workspace = true
pipette-artifacts-catalog.workspace = true
pipette-completions.workspace = true
pipette-http.workspace = true
pipette-memprobe.workspace = true
pipette-ops.workspace = true
pipette-plan-types.workspace = true
pipette-subprocess.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
httpmock.workspace = true
pipette-completions = { workspace = true, features = ["test-support"] }
rstest.workspace = true
tempfile.workspace = true
