[package]
name = "pipette-openvino"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

# Stands in for the Python server in `tests/server_cells.rs`, copied to where
# the venv's interpreter would be.
[[bin]]
name = "fake_openvino_server"
path = "tests/bin/fake_openvino_server.rs"
test = false
bench = false
doc = false

# Not gated at compile time. OpenVINO ships wheels for Linux and Windows x86_64,
# and Windows is where Intel NPU hardware lives, so unlike `pipette-mlx` this
# crate compiles everywhere. The client refuses any other OS before install
# (`pipette-cli`'s `refuse_foreign_os`), and a host without the devices at run
# time.
[dependencies]
anyhow.workspace = true
pipette-completions.workspace = true
pipette-http.workspace = true
pipette-memprobe.workspace = true
pipette-ops.workspace = true
pipette-plan-types.workspace = true
pipette-subprocess.workspace = true
pipette-venv.workspace = true
reqwest = { workspace = true, features = ["blocking", "json"] }
serde_json.workspace = true
tempfile.workspace = true

[dev-dependencies]
pipette-programs.workspace = true
pipette-completions = { workspace = true, features = ["test-support"] }
httpmock.workspace = true
rstest.workspace = true
tempfile.workspace = true
