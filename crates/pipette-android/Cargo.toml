[package]
name = "pipette-android"
version.workspace = true
edition.workspace = true
publish.workspace = true

# cargo-machete scans only this crate's directory, so it cannot see
# android/native/benchmarks.rs (included via `#[path]` in src/lib.rs), the sole
# user of anyhow, serde and pipette-ops. `tracing` is here only for its `log` feature.
[package.metadata.cargo-machete]
ignored = ["anyhow", "serde", "pipette-ops", "tracing"]

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "pipette_android"

[features]
# Backends registered in the runtime loader (src/loader.rs).
default = ["llamacpp-backend"]
llamacpp-backend = []

[dependencies]
anyhow.workspace = true
jni.workspace = true
pipette-device.workspace = true
pipette-ops.workspace = true
pipette-plan-types.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
thiserror.workspace = true

# Routes `log` records to logcat. Nothing installs a tracing subscriber, so the
# `log` feature is what carries pipette-ops and pipette-device events there too.
[target.'cfg(target_os = "android")'.dependencies]
android_logger.workspace = true
tracing = { workspace = true, features = ["log"] }

[build-dependencies]
anyhow.workspace = true

[dev-dependencies]
rstest.workspace = true
