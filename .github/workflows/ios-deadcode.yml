name: iOS Dead Code

# Weekly, not per PR: the full index build is too heavy. Report-only until the
# backlog is triaged; then drop `continue-on-error` and add `--strict`.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ios-deadcode-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with SCCACHE_VERSION in build.yml.
  SCCACHE_VERSION: v0.17.0

jobs:
  ios-deadcode:
    name: ios-deadcode
    runs-on: macos-26
    continue-on-error: true
    env:
      # Keep in step with ios-check in build.yml.
      DEVELOPER_DIR: /Applications/Xcode_26.4.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Cache sccache binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/sccache
          key: sccache-tool-${{ env.SCCACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Set up sccache (C/C++ compiler launcher)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
        with:
          version: ${{ env.SCCACHE_VERSION }}

      # Pre-built with sccache so Periphery's xcodebuild can skip its uncached
      # llama.cpp phase (PIPETTE_SKIP_BUILD_LLAMA below).
      - name: Build llama.cpp (static lib + bindings)
        env:
          SCCACHE_GHA_ENABLED: "true"
          # Keep in step with SCCACHE_GHA_VERSION in build.yml.
          SCCACHE_GHA_VERSION: "2"
        run: ./ios/build-llama.sh sim

      - name: Generate MLX build info
        run: ./ios/gen-mlx-build-info.sh

      - name: Install Periphery (pinned)
        # Bump both together; take the plain zip's digest (not the
        # `.artifactbundle.zip`'s) from `gh api repos/peripheryapp/periphery/releases/tags/<v>`.
        env:
          PERIPHERY_VERSION: "3.7.4"
          PERIPHERY_SHA256: "f8283239a82c638a4d5cfb91c42519980462b7853299562f663eb33ce54c8dc6"
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/periphery.zip" \
            "https://github.com/peripheryapp/periphery/releases/download/${PERIPHERY_VERSION}/periphery-${PERIPHERY_VERSION}.zip"
          # cd so a temp path with spaces cannot misparse the checksum line.
          (cd "$RUNNER_TEMP" && echo "${PERIPHERY_SHA256}  periphery.zip" | shasum -a 256 -c -)
          unzip -oq "$RUNNER_TEMP/periphery.zip" -d "$RUNNER_TEMP/periphery"

      # Config lives in ios/.periphery.yml.
      - name: Periphery scan (report only)
        working-directory: ios
        env:
          PIPETTE_SKIP_BUILD_LLAMA: "1"
        run: |
          {
            echo "## iOS unused-code report (Periphery)"
            echo ""
            echo '```'
            "$RUNNER_TEMP/periphery/periphery" scan --disable-update-check \
              || echo "(periphery scan did not complete — see step logs)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
