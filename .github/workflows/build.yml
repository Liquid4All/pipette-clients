name: CI

on:
  push:
    # A push to release/** publishes (github-release); main and pull requests
    # run CI only. The release version also reaches the binaries only there.
    branches: [main, 'release/**']
  # No base-branch filter: stacked PRs target intermediate heads, not only main.
  pull_request:
  workflow_dispatch:

concurrency:
  # Only pull requests supersede each other. Everything else keys on run_id,
  # so a second push to a release branch cannot cancel an in-flight publish.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

# A job-level block replaces this rather than merging, so it must restate `contents: read`.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned: with no `version:`, sccache-action installs the latest release, and a new
  # one invalidates every cache entry at once. Each call site also caches the runner
  # tool cache, which the action checks first, so a hit skips the github.com download
  # (a single point of failure that broke every job during a release-asset outage).
  SCCACHE_VERSION: v0.17.0

jobs:
  changes:
    runs-on: ubuntu-24.04
    # paths-filter lists a PR's files via `pulls.listFiles`, which needs `pull-requests: read`.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ios: ${{ steps.filter.outputs.ios }}
      python: ${{ steps.filter.outputs.python }}
      android: ${{ steps.filter.outputs.android }}
      adbconnector: ${{ steps.filter.outputs.adbconnector }}
      gpukeepalive: ${{ steps.filter.outputs.gpukeepalive }}
      coreaiswift: ${{ steps.filter.outputs.coreaiswift }}
    # PR-only: nothing else reads the outputs, and a dispatch has no `before` SHA to diff.
    # Gated per step because a skipped job would skip every job needing it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              # So a PR that loosens the license allow-list re-runs the gate.
              - 'deny.toml'
              # rust-check installs cargo-deny through it.
              - 'ci/install-tool.sh'
              # Native sources built via build.rs, listed positively: under the filter's
              # default "some" quantifier a `!ios/**` negation matches every non-ios file.
              - 'crates/**/*.{c,cc,cpp,cxx,h,hh,hpp,hxx,m,mm,metal}'
              - 'android/native/**'
              - 'cmake/**'
              - '.gitmodules'
              - '.github/**'
              # JSON fixtures pipette-contract's `contract` test reads.
              - 'crates/pipette-contract/fixtures/**'
              # Compiled in with `include_str!`: bundled catalogs, the prompt seed.
              - 'crates/**/*.toml'
              - 'crates/**/*.txt'
              # Embedded by pipette-artifacts on every platform for storage keys;
              # only supported Macs execute the Swift build.
              - 'crates/pipette-artifacts/swift/**'
              # Parsed by pipette-ctl's `example_plans` and pipette-plan-types' tests.
              - 'examples/plans/**'
              # Read by pipette-ios-proxy's test of the release manifest.
              - 'ios/release-manifest.py'
              - 'ios/Pipette/Pipette/Generated/*/*BuildInfo.json'
              - 'ios/Pipette/Pipette/Commands/RuntimesCommands.swift'
            ios:
              - 'ios/**'
              - '.github/**'
              # A llama.cpp pin bump moves the gitlink and the tag, not .gitmodules.
              - 'vendor/llama.cpp'
              - 'vendor/llama.cpp.tag'
              - 'vendor/llamacpp-*'
              # The ONNX pins feed OnnxGenaiBuildInfo; a bump moves only the gitlinks and tags.
              - 'vendor/onnxruntime'
              - 'vendor/onnxruntime-genai'
              - 'vendor/onnxruntime*.tag'
              # ContractTests round-trips the fixtures even when no Swift changed.
              - 'crates/pipette-contract/fixtures/**'
            python:
              - '**/*.py'
              - 'ruff.toml'
              - '.github/**'
            android:
              - 'android/**'
              - 'crates/pipette-android/**'
              - 'crates/pipette-ops/**'
              - '.gitmodules'
              - 'vendor/llama.cpp'
              - 'vendor/llama.cpp.tag'
              # Rust deps feed the bundled ThirdPartyLicenses.json, and a dep change
              # can touch only the lockfile; skipping here leaves it stale.
              - 'Cargo.lock'
              - '**/Cargo.toml'
              # So a PR that loosens the license gate is checked by it.
              - 'ci/android-*.py'
              - '.github/**'
            adbconnector:
              # Standalone Gradle build (no Rust, NDK or submodules), so not folded into `android`.
              # '.github/**' in every filter: a PR that edits a job must exercise it.
              - 'tools/adb-connector-apk/**'
              - '.github/**'
            gpukeepalive:
              # Standalone Windows-only cargo workspace, kept apart from the rust matrix.
              - 'tools/gpu-keepalive/**'
              - '.github/**'
            coreaiswift:
              # The Core AI sidecar package, which pipette-artifacts installs on first use.
              - 'crates/pipette-artifacts/swift/**'
              - '.github/**'

  release-metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0 # ci/version.sh needs the history behind the branch point

      - name: Compute release metadata
        id: version
        env:
          # On `pull_request` the checkout is a merge commit that is in neither
          # branch, so name the PR's head commit. Empty on every other event,
          # where ci/version.sh falls back to HEAD.
          PIPETTE_VERSION_SHA: ${{ github.event.pull_request.head.sha }}
        # Assign first: `echo "v=$(cmd)"` succeeds even when cmd fails.
        # The version code is the UTC hour, so it only increases.
        run: |
          set -euo pipefail
          version="$(ci/version.sh)"
          version_code="$(date -u +'%y%m%d%H')"
          echo "version=${version}" | tee -a "$GITHUB_OUTPUT"
          echo "version_code=${version_code}" | tee -a "$GITHUB_OUTPUT"

  conventions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Convention checks
        run: ./ci/lint.sh

  rust-check:
    name: rust-check (${{ matrix.os }})
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
            fmt: true
            # deny.toml names every target, so one leg suffices. Advisories, bans
            # and sources are the `security` workflow's.
            deny: true
          - os: macos
            runner: macos-26
          - os: windows
            runner: windows-2025
    steps:
      # No submodules: pipette-android's build script skips vendor/ off Android.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          components: ${{ matrix.fmt && 'clippy, rustfmt' || 'clippy' }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: rust-check-${{ matrix.os }}-v4
          cache-bin: false
          # No sccache here: measured ~38% hit on Linux, ~2% on Windows, and it forces
          # CARGO_INCREMENTAL=0. Dependencies only: a fresh checkout's new mtimes
          # rebuild workspace crates anyway, and they were ~75% of the cache.
          cache-workspace-crates: false

      - name: Format
        if: matrix.fmt
        run: cargo fmt --all --check

      - name: Install cargo-deny (pinned, checksum-verified)
        if: matrix.deny
        # The security workflow's pinned build, so both read deny.toml with one version.
        run: ci/install-tool.sh cargo-deny

      - name: Licenses
        if: matrix.deny
        # Before compiling: it reads only cargo metadata, so it fails in seconds.
        # Rust graph only; Android has ci/android-licenses.py, iOS see docs/licensing.md.
        run: cargo deny check licenses

      - name: Clippy
        # Lint levels come from `[workspace.lints]`, so no `-- -D warnings` here.
        # pipette-android stays in: android-app's path filter misses pipette-ops-only changes.
        run: cargo clippy --workspace --all-targets

      - name: Docs
        # Nothing else checks intra-doc links. In this matrix, not `conventions`:
        # some links resolve on only one platform.
        run: cargo doc --workspace --no-deps

      - name: Install nextest
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172  # v2.87.20
        with:
          tool: nextest

      - name: Test
        # Load-bearing: pwsh does not abort on a failing native command, so a red
        # nextest went green behind `--doc`. bash gets `-e -o pipefail`.
        shell: bash
        # --no-fail-fast: one red run reports every failure. nextest skips doctests,
        # hence the `--doc` pass.
        run: |
          cargo nextest run --workspace --no-fail-fast
          cargo test --doc --workspace

  rust-coverage:
    # Separate from rust-check: an instrumented build shares no artifacts with it.
    # Doctests are not instrumented (needs nightly).
    name: rust-coverage
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          # Its own key: instrumented artifacts would evict rust-check's.
          key: rust-coverage-linux-v2
          cache-bin: false
          # Dependencies only: `llvm-cov report` merges every test binary in the target
          # dir, so a cached one from an older commit shows as uncovered lines.
          cache-workspace-crates: false

      - name: Install nextest and cargo-llvm-cov
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172  # v2.87.20
        with:
          tool: nextest,cargo-llvm-cov

      - name: Coverage
        shell: bash
        run: |
          cargo llvm-cov nextest --workspace --no-fail-fast --no-report
          cargo llvm-cov report --lcov --output-path lcov.info
          {
            echo '## Rust line coverage'
            echo
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gate pipette-cli
        shell: bash
        # The floor sits under the measured number to absorb platform cfg
        # differences; raise it as the number climbs.
        run: cargo llvm-cov report -p pipette-cli --summary-only --fail-under-lines 90

      - name: Upload lcov
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rust-lcov
          path: lcov.info
          retention-days: 14

  python-check:
    name: python-check
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Lint
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0
        with:
          args: "check ."

      - name: Format
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0
        with:
          args: "format --check ."

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"

      - name: Test pipette-mlx
        run: ./crates/pipette-mlx/test-python.sh

      - name: Test pipette-onnx-genai
        run: ./crates/pipette-onnx-genai/test-python.sh

      - name: Test pipette-openvino
        run: ./crates/pipette-openvino/test-python.sh

  ios-check:
    name: ios-check
    needs: [changes]
    # The iOS app links no Rust, so it keys only on iOS changes.
    if: github.event_name != 'pull_request' || needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    env:
      # Not the image default 26.2: the deployment target is 26.4, and 26.2's Swift
      # miscompiles async code (stack-canary SIGABRT). Also applies to build-llama.sh's xcrun.
      DEVELOPER_DIR: /Applications/Xcode_26.4.app
      # Job-scoped so the cache key can name the version. Bump both together; the
      # digest is from `gh api repos/realm/SwiftLint/releases/tags/<v>`.
      SWIFTLINT_VERSION: "0.65.0"
      SWIFTLINT_SHA256: "d6cb0aa7a2f5f1ef306fc9e37bcb54dc9a26facc8f7784ac0c3dd3eccf5c6ba6"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # sentry-native and kleidiai are Android-only.
      - name: Check out the vendored sources
        run: git -c protocol.version=2 submodule update --init --depth=1 --recursive vendor/llama.cpp vendor/onnxruntime vendor/onnxruntime-genai

      # Cached to avoid the github.com release download (see SCCACHE_VERSION). What
      # lands in the cache was digest-verified when first fetched, below.
      - name: Cache SwiftLint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/swiftlint
          key: swiftlint-${{ env.SWIFTLINT_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: SwiftLint (strict)
        # macOS runner, so `shasum -a 256`; coreutils sha256sum is absent.
        run: |
          set -euo pipefail
          # Testing the binary rather than the cache-hit output so a partial
          # restore still self-heals by downloading.
          if [ ! -x "$RUNNER_TEMP/swiftlint/swiftlint" ]; then
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
              -o "$RUNNER_TEMP/swiftlint.zip" \
              "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
            # cd so a temp path with spaces cannot misparse the checksum line.
            (cd "$RUNNER_TEMP" && echo "${SWIFTLINT_SHA256}  swiftlint.zip" | shasum -a 256 -c -)
            unzip -oq "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          fi
          cd ios && "$RUNNER_TEMP/swiftlint/swiftlint" lint --strict --config .swiftlint.yml

      - name: Cache sccache binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/sccache
          key: sccache-tool-${{ env.SCCACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Set up sccache (C/C++ compiler launcher)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
        with:
          version: ${{ env.SCCACHE_VERSION }}

      # Xcode's compilation cache excludes SPM dependencies, so persisting DerivedData's
      # Build tree is the only cross-run reuse. SourcePackages stays at its default path:
      # the LicenseList plugin breaks if relocated. If a warm run builds stale, bump `-v1`.
      - name: Cache DerivedData (SwiftPM products + sources)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/DerivedData/Build
            ${{ runner.temp }}/DerivedData/SourcePackages
          key: spm-dd-v1-${{ runner.os }}-${{ hashFiles('ios/Pipette/Pipette.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-dd-v1-${{ runner.os }}-

      # The ~30s cold boot overlaps the build; the test step reuses this device.
      # Non-fatal: the test step boots on demand otherwise.
      - name: Pre-boot simulator
        run: xcrun simctl boot "iPhone 17" 2>/dev/null || true

      # Before xcodebuild parses the project, so its synchronized group picks up
      # Generated/Llama/. The C/C++ compiles go through sccache.
      - name: Build llama.cpp (framework + headers)
        env:
          SCCACHE_GHA_ENABLED: "true"
          # v2: this repository's v1 namespace holds reserved entries that were
          # never finalized, so every v1 write fails with `already_exists`.
          SCCACHE_GHA_VERSION: "2"
        run: ./ios/build-llama.sh sim

      # The cache key below must move when a pin moves. `.gitmodules` cannot say so: it
      # carries paths and URLs, and the pinned commits are gitlinks in the tree.
      - name: Read the ONNX submodule pins
        id: onnx-pins
        run: |
          echo "sha=$(git -C vendor/onnxruntime rev-parse HEAD)-$(git -C vendor/onnxruntime-genai rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The outputs, not the build tree: the script skips only when its `.slice`
      # stamp and archives exist; a restored build tree still recompiled everything.
      - name: Cache the ONNX Runtime GenAI build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ios/Pipette/Pipette/Generated/OnnxGenai
          key: onnx-genai-out-sim-${{ runner.os }}-${{ steps.onnx-pins.outputs.sha }}-${{ hashFiles('ios/patches/onnx-genai/*.patch', 'ios/build-onnx-genai.sh') }}

      # build-onnx-genai.sh needs uv when the cache above missed.
      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Build ONNX Runtime GenAI (static libs + Objective-C surface)
        run: ./ios/build-onnx-genai.sh sim

      # ONNX is regenerated here because build-onnx-genai.sh does so only when it
      # builds, not on a cache hit.
      - name: Generate MLX and ONNX GenAI build info
        run: |
          ./ios/gen-mlx-build-info.sh
          ./ios/gen-onnx-genai-build-info.sh

      # The app's runtime_version is baked from these stamps; a stale one ships a
      # version the collector can't recognize.
      - name: Verify build-info stamps are committed and current
        run: |
          if ! git diff --exit-code -- \
              ios/Pipette/Pipette/Generated/MLX/MLXBuildInfo.swift \
              ios/Pipette/Pipette/Generated/MLX/MLXBuildInfo.json \
              ios/Pipette/Pipette/Generated/OnnxGenai/OnnxGenaiBuildInfo.swift \
              ios/Pipette/Pipette/Generated/OnnxGenai/OnnxGenaiBuildInfo.json; then
            echo "::error::Generated build-info is stale. Run ./ios/gen-mlx-build-info.sh and ./ios/gen-onnx-genai-build-info.sh, then commit the BuildInfo .swift and .json files they write."
            exit 1
          fi

      - name: Build iOS app + tests (Simulator)
        # Already built above; an in-Xcode re-run wouldn't inherit SCCACHE_GHA_ENABLED
        # and would recompile every ggml/llama source uncached.
        env:
          PIPETTE_SKIP_BUILD_LLAMA: "1"
          PIPETTE_SKIP_BUILD_ONNX_GENAI: "1"
        run: |
          # ARCHS=arm64: build-llama.sh sim emits only arm64. The scheme, not the
          # target: the target path breaks ClerkKitUI's transitive imports. No
          # -sdk iphonesimulator: it breaks the LicenseList plugin.
          xcodebuild build-for-testing \
            -project ios/Pipette/Pipette.xcodeproj \
            -scheme Pipette \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Run iOS unit tests (Simulator)
        run: |
          # -parallel-testing-enabled NO: reuse the pre-booted simulator, not a cold clone.
          # -collect-test-diagnostics never: the log-bundle request is never answered,
          # so xcodebuild waited out its 600s timeout after every green run.
          # The .xctestrun spec skips a ~6s re-plan of the SwiftPM graph. Newest match:
          # the cached DerivedData carries specs from earlier runs and Xcode versions.
          products="$RUNNER_TEMP/DerivedData/Build/Products"
          xctestrun=$(ls -t "$products"/Pipette_*_iphonesimulator*.xctestrun 2>/dev/null | head -n1)
          if [[ -z "$xctestrun" ]]; then
            echo "::error::no simulator .xctestrun under $products — did build-for-testing run?"
            exit 1
          fi

          xcodebuild test-without-building \
            -xctestrun "$xctestrun" \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never

  ios-archive:
    # One app carrying every llama.cpp pin. ci/checks/llamacpp-variants.py keeps its
    # checkout, build steps and PIPETTE_LLAMA_PINS in step with .gitmodules.
    name: ios-archive
    needs: [release-metadata, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    env:
      # Same toolchain pin as ios-check — see the note there.
      DEVELOPER_DIR: /Applications/Xcode_26.4.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check out the vendored sources
        run: |
          git -c protocol.version=2 submodule update --init --depth=1 --recursive \
            vendor/llama.cpp \
            vendor/llamacpp-prismml \
            vendor/llamacpp-prismml-b10828 \
            vendor/llamacpp-lfm3 \
            vendor/onnxruntime \
            vendor/onnxruntime-genai

      - name: Cache sccache binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/sccache
          key: sccache-tool-${{ env.SCCACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Set up sccache (C/C++ compiler launcher)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
        with:
          version: ${{ env.SCCACHE_VERSION }}

      # Its own key: a Release device build shares no products with ios-check's tree.
      # Not `Build`: `xcodebuild archive` recompiles every source regardless of it.
      # ModuleCache.noindex is what survives (explicit module builds 303 -> 19).
      - name: Cache DerivedData (SwiftPM sources + module cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/DerivedData-archive/SourcePackages
            ${{ runner.temp }}/DerivedData-archive/ModuleCache.noindex
          key: spm-dd-archive-v2-${{ runner.os }}-${{ hashFiles('ios/Pipette/Pipette.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-dd-archive-v2-${{ runner.os }}-

      # `device`: the archive's "Embed llama.cpp" phase takes each pin from
      # ios/.build-llama/frameworks/iphoneos. Only main's build writes the headers
      # the app compiles against.
      - name: Build llama.cpp (main)
        env:
          SCCACHE_GHA_ENABLED: "true"
          SCCACHE_GHA_VERSION: "2"
        run: ./ios/build-llama.sh device

      - name: Build llama.cpp (prismml)
        env:
          SCCACHE_GHA_ENABLED: "true"
          SCCACHE_GHA_VERSION: "2"
          PIPETTE_LLAMA_VARIANT: prismml
        run: ./ios/build-llama.sh device

      - name: Build llama.cpp (prismml-b10828)
        env:
          SCCACHE_GHA_ENABLED: "true"
          PIPETTE_LLAMA_VARIANT: prismml-b10828
        run: ./ios/build-llama.sh device

      - name: Build llama.cpp (lfm3)
        env:
          SCCACHE_GHA_ENABLED: "true"
          SCCACHE_GHA_VERSION: "2"
          PIPETTE_LLAMA_VARIANT: lfm3
        run: ./ios/build-llama.sh device

      - name: Read the ONNX submodule pins
        id: onnx-pins
        run: |
          echo "sha=$(git -C vendor/onnxruntime rev-parse HEAD)-$(git -C vendor/onnxruntime-genai rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache the ONNX Runtime GenAI build (device slice)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ios/Pipette/Pipette/Generated/OnnxGenai
          key: onnx-genai-out-device-${{ runner.os }}-${{ steps.onnx-pins.outputs.sha }}-${{ hashFiles('ios/patches/onnx-genai/*.patch', 'ios/build-onnx-genai.sh') }}

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Build ONNX Runtime GenAI (device slice)
        run: ./ios/build-onnx-genai.sh device

      # The ONNX stamp too, so the archive carries one generated from this checkout
      # rather than the copy the cache restored.
      - name: Generate MLX and ONNX GenAI build info
        run: |
          ./ios/gen-mlx-build-info.sh
          ./ios/gen-onnx-genai-build-info.sh

      # Unsigned: signing would need CI certs and pin device UDIDs at build time;
      #   installers sign with their own identity (docs/pipette-ios/build.md).
      # -configuration Release: so an edit to the scheme's ArchiveAction can't ship
      #   an unoptimized archive.
      # PIPETTE_PRIVATE_*: private-API reads that keep numbers comparable with the
      #   fleet; allowed only because this asset never goes to TestFlight or the App
      #   Store. THERMAL needs both the GCC define (ObjC) and the Swift condition.
      # PIPETTE_LLAMA_PINS: every pin built above; unset, the app carries main's alone.
      - name: Archive iOS app (Release, unsigned, internal)
        env:
          PIPETTE_SKIP_BUILD_LLAMA: "1"
          PIPETTE_SKIP_BUILD_ONNX_GENAI: "1"
          # Stamped into the built Info.plist; without it `client_version` is just `1`.
          # Unconditional: the archive recompiles from scratch, so there is no cache to protect.
          PIPETTE_BUILD_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          pins=(
            llamacpp
            llamacpp-prismml
            llamacpp-prismml-b10828
            llamacpp-lfm3
          )
          xcodebuild archive \
            -project ios/Pipette/Pipette.xcodeproj \
            -scheme Pipette \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Pipette.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-archive" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            "PIPETTE_LLAMA_PINS=${pins[*]}" \
            'GCC_PREPROCESSOR_DEFINITIONS=$(inherited) PIPETTE_PRIVATE_THERMAL=1' \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) PIPETTE_PRIVATE_THERMAL PIPETTE_PRIVATE_MEMORY'

      # An unsigned binary carries no entitlements, and `xcodebuild -exportArchive`, the
      # fleet's signing path, keeps only the ones the binary carries: without this its
      # builds lost increased-memory-limit and got iOS's default per-app memory ceiling.
      - name: Ad-hoc sign the archive with the app's entitlements
        run: ./ios/adhoc-sign-archive.sh "$RUNNER_TEMP/Pipette.xcarchive" "$RUNNER_TEMP/DerivedData-archive"

      # The `-internal` suffix is derived from what the product carries, never restated.
      # By string, not symbol: Release strips symbols, and only these `dlsym` literals
      # are compiled in solely when a flag is on.
      - name: Confirm the private-API flags took
        run: |
          app="$RUNNER_TEMP/Pipette.xcarchive/Products/Applications/Pipette.app/Pipette"
          found="$RUNNER_TEMP/pipette-strings.txt"
          strings -a "$app" > "$found"
          if ! grep -q "IOHIDEventSystemClientCreate" "$found"; then
            echo "::error::PIPETTE_PRIVATE_THERMAL did not take — the archive has no IOHID lookups, so its readiness gate would fall back to thermalState"
            exit 1
          fi
          if ! grep -q "proc_reset_footprint_interval" "$found"; then
            echo "::error::PIPETTE_PRIVATE_MEMORY did not take — the archive has no footprint-interval lookup, so max_memory_usage would be the 20 ms sample alone"
            exit 1
          fi
          echo "flavor=-internal" >> "$GITHUB_ENV"

      # The archive cannot run here, so the script restates its runtimes from source
      # and from the llama.cpp frameworks it carries.
      - name: Write the build manifest
        run: |
          ver='${{ needs.release-metadata.outputs.version }}'
          out="$RUNNER_TEMP/pipette-ios-${ver}${flavor}.json"
          ./ios/release-manifest.py "${ver}${flavor}" --private-thermal --private-memory \
            --frameworks "$RUNNER_TEMP/Pipette.xcarchive/Products/Applications/Pipette.app/Frameworks" > "$out"
          echo "manifest_json=${out}" >> "$GITHUB_ENV"
          cat "$out"

      # `ditto`, not `zip`: zip flattens symlinks and xattrs, which a re-sign then rejects.
      # Quoted heredoc: unquoted, every Markdown backtick would be a command substitution.
      - name: Package the archive
        run: |
          ver='${{ needs.release-metadata.outputs.version }}'
          stage="$RUNNER_TEMP/pipette-ios-${ver}${flavor}"
          mkdir -p "$stage"
          ditto "$RUNNER_TEMP/Pipette.xcarchive" "$stage/Pipette.xcarchive"
          { printf '# Pipette iOS %s\n\n' "${ver}${flavor}"; cat <<'EOF'
          **Not distributable.** A Release arm64 archive for on-device benchmarking on
          registered development devices. It contains private Apple APIs (below), so
          it must never reach TestFlight or the App Store.

          ## Not signed for any device

          Sign it with your own identity before installing; see
          `docs/pipette-ios/build.md`, "Installing a released archive". It carries an
          ad-hoc signature with the app's entitlements and no provisioning profile, so
          it is not tied to any device list and does not expire, but it will not
          launch until you sign it.

          ## Thermals: private SoC read is ON

          Built **with** `PIPETTE_PRIVATE_THERMAL`, which is what makes its numbers
          comparable to the rest of the fleet:

          - The readiness gate waits on a real SoC die temperature between measured
            reps, rather than falling back to `ProcessInfo.thermalState` plus the
            calibrated IMU estimate.
          - `device_hardware_readings` carries every IOHID temperature sensor
            on submitted results.
          - The log carries each measured rep's CPU-cluster and GPU clock-state
            residency, read through the private IOReport library.
          - The build says so about itself: the version carries `-internal`, so
            `client_version` on every submitted row identifies how it was gated.
            Confirm on a device with `headlessrun version`.

          ## Memory: kernel footprint peak and reclaim-ring flush are ON

          Built **with** `PIPETTE_PRIVATE_MEMORY`: `max_memory_usage` reports the
          kernel's exact footprint peak over each measured bracket (a private libproc
          read) when it exceeds the 20 ms sample, which can miss a short spike such as
          MLX's prefill. It also flushes libmalloc's reclaim ring (`mach_vm_reclaim_*`)
          before each bracket, so a cell does not inherit memory that earlier cells in
          the process freed.

          > **Never submit this build to TestFlight or the App Store.** It reads the
          > SoC die temperature and the kernel's footprint peak, and flushes libmalloc's
          > reclaim ring, through private APIs,
          > which App Review rejects. It is for side-loading onto registered
          > development devices only — see
          > `docs/pipette-ios/private-thermal-release-build.md`.
          EOF
          } > "$stage/INTERNAL-BUILD.md"
          out="$RUNNER_TEMP/pipette-ios-${ver}${flavor}.xcarchive.zip"
          ditto -c -k --keepParent "$stage" "$out"
          echo "archive_zip=${out}" >> "$GITHUB_ENV"
          ls -lh "$out"

      - name: Upload iOS archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # `pipette-*` so github-release's download pattern picks it up.
          name: pipette-ios-archive
          path: |
            ${{ env.archive_zip }}
            ${{ env.manifest_json }}
          if-no-files-found: error

  android-app:
    name: android-app
    needs: [changes, release-metadata]
    if: github.event_name != 'pull_request' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    env:
      # Release path only: a per-commit value in BuildConfig defeats the gradle build cache.
      # PIPETTE_VERSION_CODE is deliberately unset: it marks an official distribution
      # (android-release-distribution.yml), and verifyReleaseSentryDsn would then fail forks.
      PIPETTE_BUILD_VERSION: ${{ startsWith(github.ref, 'refs/heads/release/') && needs.release-metadata.outputs.version || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: true

      # What the APK builds from, not onnxruntime (iOS-only). kleidiai stays for
      # its license file, which the attribution check reads unconditionally.
      - name: Check out the vendored sources
        run: git -c protocol.version=2 submodule update --init --depth=1 --recursive vendor/llama.cpp vendor/sentry-native vendor/kleidiai

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      # Not setup-java's `cache: gradle`, which its docs say not to combine with this.
      # cache-provider: the default 'enhanced' routes through a third-party service.
      # Without cache-encryption-key no configuration cache is saved at all; an empty
      # secret (fork PR) only disables that.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          cache-provider: basic
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up Android SDK
        # The default legacy `tools` package pulls in the emulator (~14s), which CI never boots.
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4
        with:
          packages: platform-tools

      - name: Cache Android NDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          key: android-ndk-27.2.12479018-${{ runner.os }}

      - name: Install Android NDK + native build tools
        run: |
          yes | sdkmanager --install "ndk;27.2.12479018" >/dev/null
          # Install before any `apt-get update`: the image's indexes are current, and a
          # dead package mirror once hung the update for 30min. The timeouts bound
          # both paths so a stalled mirror fails over in seconds or fails the job.
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10)
          sudo timeout 300 apt-get "${apt_opts[@]}" install -y --no-install-recommends ninja-build cmake || {
            sudo timeout 300 apt-get "${apt_opts[@]}" update
            sudo timeout 300 apt-get "${apt_opts[@]}" install -y --no-install-recommends ninja-build cmake
          }

      - name: Install Rust (Android target)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: android-app-v1
          cache-bin: false

      - name: Cache sccache binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/sccache
          key: sccache-tool-${{ env.SCCACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      # Used by build-rust-android.sh's compiler launchers for the llama.cpp/ggml cross-compile.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
        with:
          version: ${{ env.SCCACHE_VERSION }}

      - name: Build debug + release APKs + run unit tests
        working-directory: android/Pipette
        env:
          # Public by design, kept out of VCS; an empty key is tolerated (debug stays
          # gate-bypassable).
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_PUBLISHABLE_KEY_DEBUG: ${{ secrets.CLERK_PUBLISHABLE_KEY_DEBUG }}
          # Its presence is what turns crash reporting on; empty keeps a fork's run
          # green and telemetry-free.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # POSTHOG_HOST is a repo variable, not a secret; unset falls back to the US cloud.
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          SCCACHE_GHA_ENABLED: "true"
          SCCACHE_GHA_VERSION: "2"
        # assemble first so the APKs exist for upload even if a unit test fails. Without
        # RELEASE_* secrets, release is signed with the shared debug keystore.
        run: ./gradlew :app:assembleKotlinEngineDebug :app:assembleKotlinEngineRelease :app:testKotlinEngineDebugUnitTest --no-daemon --stacktrace

      - name: Verify computed native libs 16 KB page-size compatibility
        working-directory: android/Pipette
        run: ../../ci/android-16kb-page-size.sh app/build/generated/kotlinJniLibs

      - name: Verify release APK 16 KB page-size compatibility
        working-directory: android/Pipette
        run: ../../ci/android-16kb-page-size.sh app/build/outputs/apk/kotlinEngine/release/app-kotlinEngine-release.apk

      - name: Licenses (shipping dependencies)
        # always(): a failing unit test above must not mask a license regression.
        if: always()
        run: |
          ./ci/android-licenses.py --selftest
          ./ci/android-licenses.py

      - name: Attribution file up to date
        # Generated: fix with `./ci/android-attribution.py --write`, then commit.
        if: always()
        run: ./ci/android-attribution.py --check

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pipette-debug-apk
          path: android/Pipette/app/build/outputs/apk/kotlinEngine/debug/app-kotlinEngine-debug.apk
          if-no-files-found: warn

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pipette-release-apk
          path: android/Pipette/app/build/outputs/apk/kotlinEngine/release/*.apk
          if-no-files-found: warn

      - name: APK summary
        if: always()
        run: |
          DEBUG_APK=android/Pipette/app/build/outputs/apk/kotlinEngine/debug/app-kotlinEngine-debug.apk
          RELEASE_APK="$(ls android/Pipette/app/build/outputs/apk/kotlinEngine/release/*.apk 2>/dev/null | head -1)"
          row() { # <label> <path> <artifact-name>
            if [ -f "$2" ]; then
              printf '| %s | `%s` | %s | `%s` | `%s` |\n' \
                "$1" "$(basename "$2")" "$(du -h "$2" | cut -f1)" "$(sha256sum "$2" | cut -d' ' -f1)" "$3"
            else
              printf '| %s | :x: not produced | — | — | `%s` |\n' "$1" "$3"
            fi
          }
          {
            echo "## Pipette Android — APKs"
            echo ""
            echo "| Variant | File | Size | SHA-256 | Artifact |"
            echo "| --- | --- | --- | --- | --- |"
            row "debug (dev Clerk)" "$DEBUG_APK" "pipette-debug-apk"
            row "release (prod Clerk)" "$RELEASE_APK" "pipette-release-apk"
            echo ""
            echo "Download from the **Artifacts** section of this run."
          } >> "$GITHUB_STEP_SUMMARY"

  android-lint:
    name: android-lint
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      # Same settings as android-app so both share one entry. The configuration cache
      # matters most here: 85s of a 93s build was task-graph calculation.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          cache-provider: basic
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up Android SDK
        # AGP needs the SDK to configure :app, even though ktfmt/detekt only read sources.
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4
        with:
          packages: platform-tools

      - name: Check Kotlin format (ktfmt) + lint (detekt)
        working-directory: android/Pipette
        # Neither tool discovers AGP-9 built-in-Kotlin source sets; see app/build.gradle.kts.
        # Fix with `:app:ktfmtFormat`; baseline detekt (rarely) with `:app:detektBaseline`.
        run: ./gradlew :app:ktfmtCheck :app:detekt --no-daemon --stacktrace

  adb-connector:
    name: adb-connector
    needs: [changes, release-metadata]
    if: github.event_name != 'pull_request' || needs.changes.outputs.adbconnector == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        # Not setup-java's `cache: gradle`: its key hashes `**/*.gradle*` repo-wide, so an
        # android/Pipette edit would bust this job's cache.
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          cache-provider: basic
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4
        with:
          packages: platform-tools

      - name: Check Kotlin format (ktfmt)
        working-directory: tools/adb-connector-apk
        run: ./gradlew :app:ktfmtCheck --no-daemon --stacktrace

      - name: Build APK
        working-directory: tools/adb-connector-apk
        env:
          # versionCode is the build's UTC hour, so the farm's `adb install -r` never meets a downgrade.
          PIPETTE_ADB_CONNECTOR_VERSION_NAME: ${{ needs.release-metadata.outputs.version }}
          PIPETTE_ADB_CONNECTOR_VERSION_CODE: ${{ needs.release-metadata.outputs.version_code }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Name the APK for release
        working-directory: tools/adb-connector-apk
        # github-release merges every `pipette-*` artifact into one flat dir, where
        # app-debug.apk would collide with android-app's.
        run: mv app/build/outputs/apk/debug/app-debug.apk pipette-adb-connector.apk

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pipette-adb-connector-apk
          path: tools/adb-connector-apk/pipette-adb-connector.apk
          if-no-files-found: error

  gpu-keepalive:
    # The runner has no GPU: the smoke test covers packaging, the service protocol and
    # the CLI, not the idle-eviction workaround itself.
    name: gpu-keepalive
    needs: [changes, release-metadata]
    if: github.event_name != 'pull_request' || needs.changes.outputs.gpukeepalive == 'true'
    runs-on: windows-2025
    env:
      # WiX v5 is MS-RL. v6 introduced the Open Source Maintenance Fee, which is a
      # licensing decision rather than a build one, so the major version is pinned.
      WIX_VERSION: "5.0.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Compute versions
        id: version
        shell: pwsh
        run: |
          # MSI ProductVersion caps at 255.255.65535, so the train 2026.09.1 becomes
          # 26.9.1; the binary carries the full string. A build with no train
          # (`dev-<n>-g<sha>`) packages as 0.0.0.
          $build = '${{ needs.release-metadata.outputs.version }}'
          if ($build -match '^20(\d{2})\.(\d{2})\.(\d+)-') {
            $numeric = '{0}.{1}.{2}' -f [int]$Matches[1], [int]$Matches[2], [int]$Matches[3]
          } elseif ($build -match '^dev-') {
            $numeric = '0.0.0'
          } else {
            throw "unexpected release version '$build'"
          }
          "numeric=$numeric" >> $env:GITHUB_OUTPUT
          "build=$build" >> $env:GITHUB_OUTPUT

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: tools/gpu-keepalive
          key: gpu-keepalive-v1

      # A standalone workspace that rust-check never sees, so its gates run here.
      - name: Lint and test
        working-directory: tools/gpu-keepalive
        shell: pwsh
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { throw "cargo fmt --check failed" }
          cargo clippy --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "cargo clippy failed" }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed" }

      - name: Build
        working-directory: tools/gpu-keepalive
        shell: pwsh
        env:
          # Passed as environment rather than arguments: PowerShell splits a bare
          # `--flag=26.9.11` at the first dot.
          GPU_KEEPALIVE_VERSION: ${{ steps.version.outputs.numeric }}
          GPU_KEEPALIVE_BUILD: ${{ steps.version.outputs.build }}
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install wix --version $env:WIX_VERSION --tool-path "$env:RUNNER_TEMP\wix"
          if ($LASTEXITCODE -ne 0) { throw "installing wix failed" }
          & "$env:RUNNER_TEMP\wix\wix.exe" extension add -g "WixToolset.Util.wixext/$env:WIX_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "adding the wix Util extension failed" }

      - name: Package MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $version = '${{ steps.version.outputs.numeric }}'
          # Built twice: the second package carries the same version but its own
          # ProductCode, which is what the smoke test upgrades with.
          foreach ($output in "dist\pipette-gpu-keepalive-x86_64-pc-windows-msvc.msi", "$env:RUNNER_TEMP\upgrade.msi") {
            & "$env:RUNNER_TEMP\wix\wix.exe" build tools/gpu-keepalive/package/Package.wxs `
              -arch x64 `
              -ext WixToolset.Util.wixext `
              -d "Version=$version" `
              -d "BinDir=tools/gpu-keepalive/target/release" `
              -o $output
            if ($LASTEXITCODE -ne 0) { throw "wix build failed for $output" }
          }

      - name: Smoke test (install, toggle, upgrade, uninstall)
        shell: pwsh
        run: |
          ./tools/gpu-keepalive/package/smoke-test.ps1 `
            -Msi "dist\pipette-gpu-keepalive-x86_64-pc-windows-msvc.msi" `
            -UpgradeMsi "$env:RUNNER_TEMP\upgrade.msi"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pipette-gpu-keepalive-x86_64-pc-windows-msvc.msi
          path: dist/pipette-gpu-keepalive-x86_64-pc-windows-msvc.msi
          # github-release publishes this path; a missing file must fail here
          # rather than become an empty release asset.
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          # Deliberately not named pipette-*: github-release downloads that prefix.
          name: gpu-keepalive-smoke-logs
          path: |
            ${{ runner.temp }}/msi-*.log
            ${{ runner.temp }}/service-*.txt

  ios-proxy:
    # rust-check lints and tests it; this only builds the archive the farm installs.
    name: ios-proxy
    needs: [changes, release-metadata]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: macos-26
    env:
      PIPETTE_IOS_PROXY_VERSION: ${{ startsWith(github.ref, 'refs/heads/release/') && needs.release-metadata.outputs.version || 'dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: ios-proxy-v1

      - name: Build
        run: cargo build --release --locked -p pipette-ios-proxy

      - name: Package
        run: |
          set -euo pipefail
          test "$(./target/release/pipette-ios-proxy --version)" = "pipette-ios-proxy ${PIPETTE_IOS_PROXY_VERSION}"
          staging="$(mktemp -d)"
          cp target/release/pipette-ios-proxy \
            tools/pipette-ios-proxy/pipette-ios-proxy.toml.example \
            tools/pipette-ios-proxy/package/ai.liquid.pipette.ios-proxy.plist \
            "$staging/"
          mkdir -p dist
          tar -C "$staging" -czf dist/pipette-ios-proxy-aarch64-apple-darwin.tar.gz .
          tar -tzf dist/pipette-ios-proxy-aarch64-apple-darwin.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # `pipette-` prefix so github-release downloads it.
          name: pipette-ios-proxy-aarch64-apple-darwin.tar.gz
          path: dist/pipette-ios-proxy-aarch64-apple-darwin.tar.gz
          if-no-files-found: error

  coreai-swift:
    # The only build of the sidecar package before a benchmark host runs it.
    name: coreai-swift
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.coreaiswift == 'true'
    # The package imports the CoreAI framework, which only the macOS 27 SDK has.
    # `xcode-27` is GitHub's image with that SDK.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build the sidecar
        working-directory: crates/pipette-artifacts/swift
        # The command that pipette-artifacts runs. A Package.resolved out of
        # step with Package.swift fails here.
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          swift build -c release --disable-automatic-resolution

  build-artifact:
    needs: [changes, release-metadata]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.runner }}
    env:
      # Release path only: a per-commit version baked in via `env!` would invalidate
      # the crate on every build.
      PIPETTE_CLI_BUILD_VERSION: ${{ startsWith(github.ref, 'refs/heads/release/') && needs.release-metadata.outputs.version || 'dev' }}
      # Also reuses workspace crates, which the target-dir cache drops.
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: "2"
      RUSTC_WRAPPER: sccache
    strategy:
      fail-fast: false
      matrix:
        #   packages          Compiled in ONE `cargo build`, sharing the dependency compile.
        #   binaries          Packaged into `asset_name`; a subset of what `packages` produces.
        #   ctl_asset_name    Optional: ship `pipette-ctl` (must be in `packages`) as its
        #                     own artifact under this name.
        #   glibc_max         Optional, linux-gnu only: the build fails if a shipped binary
        #                     needs a newer GLIBC_x.y.
        include:
          - target: aarch64-linux-android
            runner: ubuntu-24.04
            asset_name: pipette-cli-aarch64-linux-android.tar.gz
            archive: tar.gz
            android: true
            packages: pipette-cli
            binaries: pipette
            # Lints the target_os="android" branches no rust-check host compiles.
            target_clippy: true
          # Load-bearing 22.04, not 24.04: the runner's glibc is the release's floor,
          # and 24.04-built assets died on the 22.04 (glibc 2.35) H100 farm nodes.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            glibc_max: "2.35"
            asset_name: pipette-cli-x86_64-unknown-linux-gnu.tar.gz
            archive: tar.gz
            packages: pipette-cli pipette-ctl
            binaries: pipette
            ctl_asset_name: pipette-ctl-x86_64-unknown-linux-gnu.tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            # 22.04 gives 2.35 here too; the Debian 12 boards (2.36) leave a
            # little headroom, the H100 nodes none.
            glibc_max: "2.35"
            asset_name: pipette-cli-aarch64-unknown-linux-gnu.tar.gz
            archive: tar.gz
            cross_packages: gcc-aarch64-linux-gnu
            cross_linker: aarch64-linux-gnu-gcc
            packages: pipette-cli pipette-ctl
            binaries: pipette
            ctl_asset_name: pipette-ctl-aarch64-unknown-linux-gnu.tar.gz
          - target: aarch64-apple-darwin
            runner: macos-26
            asset_name: pipette-cli-aarch64-apple-darwin.tar.gz
            archive: tar.gz
            # pipette-mlx is a pipette-cli dependency, built here but not shipped.
            packages: pipette-cli pipette-ctl pipette-mlx
            binaries: pipette
            ctl_asset_name: pipette-ctl-aarch64-apple-darwin.tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            asset_name: pipette-cli-x86_64-pc-windows-msvc.zip
            archive: zip
            packages: pipette-cli pipette-ctl
            binaries: pipette
            ctl_asset_name: pipette-ctl-x86_64-pc-windows-msvc.zip
          - target: aarch64-pc-windows-msvc
            runner: windows-2022
            asset_name: pipette-cli-aarch64-pc-windows-msvc.zip
            archive: zip
            packages: pipette-cli pipette-ctl
            binaries: pipette
            ctl_asset_name: pipette-ctl-aarch64-pc-windows-msvc.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Nothing needs LFS today; scoped to Android so the other legs skip the fetch.
          lfs: ${{ matrix.android || false }}

      # Keyed on the runner, not matrix.target: the arm64 Windows leg cross-compiles on x64.
      - name: Cache sccache binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/sccache
          key: sccache-tool-${{ env.SCCACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
        with:
          version: ${{ env.SCCACHE_VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Install cross-compilation toolchain
        if: matrix.cross_packages
        run: |
          # Skip `apt-get update` on the fast path: a refresh blocks ~3min on the
          # un-mirrored security.ubuntu.com. Bounded like android-app's NDK step.
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10)
          sudo timeout 300 apt-get "${apt_opts[@]}" install -y ${{ matrix.cross_packages }} || {
            sudo timeout 300 apt-get "${apt_opts[@]}" update
            sudo timeout 300 apt-get "${apt_opts[@]}" install -y ${{ matrix.cross_packages }}
          }

      - name: Set cross-compilation linker
        if: matrix.cross_linker
        run: |
          upper_target="$(echo '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')"
          echo "CARGO_TARGET_${upper_target}_LINKER=${{ matrix.cross_linker }}" >> "$GITHUB_ENV"

      - name: Set up Android NDK
        if: matrix.android
        # dl.google.com publishes no sha256: this digest was hashed locally and its SHA-1
        # matched to repository2-3.xml. Re-verify that way when bumping.
        env:
          ANDROID_NDK_VERSION: "r27c"
          ANDROID_NDK_SHA256: "59c2f6dc96743b5daf5d1626684640b20a6bd2b1d85b13156b90333741bad5cc"
        run: |
          set -euo pipefail
          curl -fsSL "https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip" -o ndk.zip
          echo "${ANDROID_NDK_SHA256}  ndk.zip" | sha256sum -c -
          unzip -q ndk.zip
          NDK_HOME="$(pwd)/android-ndk-${ANDROID_NDK_VERSION}"
          TOOLCHAIN="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64"
          echo "ANDROID_NDK_HOME=${NDK_HOME}" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=${TOOLCHAIN}/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=${TOOLCHAIN}/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${TOOLCHAIN}/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

      # sccache barely helps the Rust graph (~38% hit), so the target dir is cached too.
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        continue-on-error: true
        with:
          # Bump on a runner image change: cargo's fingerprint omits the host C compiler,
          # so it would reuse C objects built against another glibc.
          key: build-artifact-${{ matrix.asset_name }}-v4
          cache-bin: false
          cache-workspace-crates: true

      # --release shares the C++ build with the build step; no --all-targets since
      # cross tests can't run here.
      - name: Clippy
        if: ${{ matrix.target_clippy }}
        run: |
          pkgs=""
          for pkg in ${{ matrix.packages }}; do pkgs="$pkgs -p $pkg"; done
          cargo clippy $pkgs --release --target ${{ matrix.target }}
        shell: bash

      - name: Build release binary
        run: |
          # One invocation: per-package builds resolve features separately and
          # recompile shared crates once per package.
          pkgs=""
          for pkg in ${{ matrix.packages }}; do pkgs="$pkgs -p $pkg"; done
          cargo build --release $pkgs --target ${{ matrix.target }}
        shell: bash

      - name: Check glibc floor
        if: matrix.glibc_max
        run: |
          set -euo pipefail
          bins='${{ matrix.binaries }}'
          if [ -n '${{ matrix.ctl_asset_name }}' ]; then
            bins="$bins pipette-ctl"
          fi
          # readelf, not objdump: it reads any ELF arch, so it serves the cross-built leg.
          rc=0
          for bin in $bins; do
            path="target/${{ matrix.target }}/release/$bin"
            floor="$(readelf --wide --dyn-syms "$path" | grep -o 'GLIBC_[0-9.]*' | sed 's/^GLIBC_//' | sort -Vu | tail -n1)"
            if [ -z "$floor" ]; then
              echo "::error::$bin: no GLIBC_ symbol versions found — not a dynamically linked glibc binary?"
              rc=1
            elif [ "$(printf '%s\n%s\n' "$floor" '${{ matrix.glibc_max }}' | sort -V | tail -n1)" != '${{ matrix.glibc_max }}' ]; then
              echo "::error::$bin requires glibc $floor, above the ${{ matrix.glibc_max }} floor this asset promises. Was the runner moved off 22.04?"
              readelf --wide --dyn-syms "$path" | grep "GLIBC_$floor" || true
              rc=1
            else
              echo "$bin: glibc floor $floor (max ${{ matrix.glibc_max }})"
            fi
          done
          exit $rc
        shell: bash

      - name: Ad-hoc sign macOS release binaries
        if: contains(matrix.target, 'apple-darwin')
        run: |
          bins='${{ matrix.binaries }}'
          if [ -n '${{ matrix.ctl_asset_name }}' ]; then
            bins="$bins pipette-ctl"
          fi
          for bin in $bins; do
            path="target/${{ matrix.target }}/release/$bin"
            if [ -f "$path" ]; then
              xattr -cr "$path"
              codesign --force --sign - "$path"
              codesign --verify --strict --verbose=4 "$path"
            fi
          done
        shell: bash

      - name: Package release artifact (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/${{ matrix.asset_name }}" ${{ matrix.binaries }}
        shell: bash

      - name: Package release artifact (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $binaries = '${{ matrix.binaries }}' -split ' ' | Where-Object { $_ }
          $paths = $binaries | ForEach-Object { "target/${{ matrix.target }}/release/$_.exe" }
          Compress-Archive -Path $paths -DestinationPath "dist/${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

      - name: Package pipette-ctl artifact (tar.gz)
        if: matrix.ctl_asset_name && matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/${{ matrix.ctl_asset_name }}" pipette-ctl
        shell: bash

      - name: Package pipette-ctl artifact (zip)
        if: matrix.ctl_asset_name && matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/pipette-ctl.exe" -DestinationPath "dist/${{ matrix.ctl_asset_name }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: matrix.ctl_asset_name
        with:
          name: ${{ matrix.ctl_asset_name }}
          path: dist/${{ matrix.ctl_asset_name }}

  build-complete:
    # The one required check. A failed job skips its dependents and skips are
    # tolerated, so prerequisites are listed too or their failure reads as green.
    needs: [changes, release-metadata, conventions, rust-check, rust-coverage, python-check, build-artifact, ios-check, ios-archive, android-app, android-lint, adb-connector, gpu-keepalive, ios-proxy, coreai-swift]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify all builds succeeded
        run: |
          # 'skipped' is OK (path-filtered on PRs); cancelled must fail like failure.
          result='${{ join(needs.*.result, ',') }}'
          echo "upstream results: $result"
          case "$result" in
            *failure*|*cancelled*)
              echo "one or more upstream jobs did not succeed"
              exit 1
              ;;
          esac

  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    needs: [release-metadata, build-complete]
    runs-on: ubuntu-24.04
    # Serialize publishes against one release branch so two pushes can't race
    # to create the same tag.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # The version carries the commit, so this only fires when the same
      # commit is published twice, as in a re-run.
      - name: Skip if this release already exists
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "${VER}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::notice::release ${VER} already exists, not republishing"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "publishing ${VER}"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        if: steps.guard.outputs.skip != 'true'
        with:
          pattern: "pipette-*"
          merge-multiple: true
          path: dist

      - name: Stage Android release APK (versioned)
        if: steps.guard.outputs.skip != 'true'
        # The debug APK rides along in the download; drop it so it is neither
        # published nor checksummed.
        run: |
          ver='${{ needs.release-metadata.outputs.version }}'
          rm -f dist/app-debug.apk dist/app-*-debug.apk
          APK_SRC="$(ls dist/app-kotlinEngine-release.apk dist/app-*-release.apk dist/app-release.apk 2>/dev/null | head -1)"
          if [ -n "$APK_SRC" ] && [ -f "$APK_SRC" ]; then
            mv "$APK_SRC" "dist/pipette-${ver}.apk"
            echo "staged dist/pipette-${ver}.apk from $APK_SRC"
          else
            echo "::warning::dist/app-*-release.apk not found: Android APK will not be attached"
            ls -la dist || true
          fi

      - name: Stage ADB Connector APK (versioned)
        if: steps.guard.outputs.skip != 'true'
        # Warns rather than failing the release of everything else.
        run: |
          ver='${{ needs.release-metadata.outputs.version }}'
          if [ -f dist/pipette-adb-connector.apk ]; then
            mv dist/pipette-adb-connector.apk "dist/pipette-adb-connector-${ver}.apk"
            echo "staged dist/pipette-adb-connector-${ver}.apk"
          else
            echo "::warning::dist/pipette-adb-connector.apk not found — ADB Connector APK will not be attached"
          fi

      - name: Checksum release assets
        if: steps.guard.outputs.skip != 'true'
        # Proves integrity, not authenticity: whoever can replace an asset can
        # replace its checksum.
        run: |
          set -euo pipefail
          cd dist
          for f in *; do
            [ -f "$f" ] || continue
            sha256sum "$f" > "${f}.sha256"
          done
          ls -1

      - name: Create GitHub release
        if: steps.guard.outputs.skip != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ needs.release-metadata.outputs.version }}
          name: ${{ needs.release-metadata.outputs.version }}
          generate_release_notes: true
          # Assets are listed explicitly so nothing unexpected in dist/ can
          # ship. The `*.sha256` glob is safe because the staging step removed
          # the only file that must not be published.
          files: |
            dist/pipette-${{ needs.release-metadata.outputs.version }}.apk
            dist/pipette-adb-connector-${{ needs.release-metadata.outputs.version }}.apk
            dist/pipette-ios-${{ needs.release-metadata.outputs.version }}-internal.xcarchive.zip
            dist/pipette-ios-${{ needs.release-metadata.outputs.version }}-internal.json
            dist/pipette-ctl-x86_64-unknown-linux-gnu.tar.gz
            dist/pipette-ctl-aarch64-unknown-linux-gnu.tar.gz
            dist/pipette-ctl-aarch64-apple-darwin.tar.gz
            dist/pipette-ctl-x86_64-pc-windows-msvc.zip
            dist/pipette-ctl-aarch64-pc-windows-msvc.zip
            dist/pipette-cli-x86_64-unknown-linux-gnu.tar.gz
            dist/pipette-cli-aarch64-unknown-linux-gnu.tar.gz
            dist/pipette-cli-aarch64-apple-darwin.tar.gz
            dist/pipette-cli-x86_64-pc-windows-msvc.zip
            dist/pipette-cli-aarch64-pc-windows-msvc.zip
            dist/pipette-cli-aarch64-linux-android.tar.gz
            dist/pipette-gpu-keepalive-x86_64-pc-windows-msvc.msi
            dist/pipette-ios-proxy-aarch64-apple-darwin.tar.gz
            dist/*.sha256

