name: Android Release Distribution

# The Play bundle is built here, not locally, because a local bundleRelease silently
# falls back to the debug keystore, and the key that signs the FIRST Play upload
# becomes the account's permanent upload certificate.
#
# `environment:` keeps the old `firebase-distribution` name so its protection rules
# and required reviewers don't have to be re-created.
#
# RENAMING THIS FILE restarts the run number: raise PIPETTE_VERSION_CODE_BASE (see
# "Resolve build identity") or Play rejects the versionCode.
#
# Secrets: RELEASE_* and CLERK_* are repository secrets; FIREBASE_SERVICE_ACCOUNT and
# GOOGLE_PLAY_SERVICE_ACCOUNT_JSON are scoped to the environment, which only a job
# declaring it can read. Put new credentials there: `gh secret set NAME --env firebase-distribution`.
#   - FIREBASE_SERVICE_ACCOUNT needs roles/firebaseappdistro.admin on project liquid-leap.
#   - GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: a key from any Cloud project with the Android
#     Publisher API enabled, invited in Play Console (Users and permissions) as
#     "Release manager". That invite, not Cloud IAM or the Console "API access" page,
#     grants Play authority. Ours is pipette-play-publisher@liquid-leap.iam.gserviceaccount.com.
#   - BOOTSTRAP: the Play API rejects edits for a package that has never had a
#     release ("Package not found"), so the FIRST bundle must be uploaded by hand.
#   - FIREBASE_TESTER_GROUPS (variable): groups must already exist in App Distribution.

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: "What to build: firebase = APK to App Distribution; play = signed AAB attached to this run; both."
        required: false
        type: choice
        options: [firebase, play, both]
        default: firebase
      publish_to_play:
        description: "Also push the signed bundle to the Play internal testing track. Requires distribution = play or both."
        required: false
        type: boolean
        default: false
      groups:
        description: "Tester group alias(es), comma-separated. Overrides the FIREBASE_TESTER_GROUPS variable."
        required: false
        default: ""
      notes:
        description: "Release-notes override. If empty, notes are the commits on this ref since main."
        required: false
        default: ""
  pull_request:
    types: [labeled]

concurrency:
  # Bucketed by whether the run does a Firebase rollout: `firebase` and `both` share
  # one so rollouts of a ref supersede each other; `play` gets its own so it can't
  # cancel an approved tester rollout. A later `firebase` can still cancel `both`.
  group: >-
    android-release-distribution-${{ github.event.pull_request.number || github.ref }}-${{
    (github.event.inputs.distribution || 'firebase') == 'play' && 'play' || 'firebase' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  distribute:
    name: build & release (Android)
    # Forks have no secrets and would fail at "Decode release keystore", so skip them.
    # The environment below doesn't cover this: its protection rules aren't copied to forks.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.repository == 'Liquid4All/pipette-clients') ||
      (github.event.label.name == 'build-deploy-firebase' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    # Required reviewers: a labeled PR can't run its (possibly modified) build code
    # against the keystore and credentials until a maintainer approves.
    environment: firebase-distribution
    permissions:
      contents: read
    env:
      # The label trigger carries no inputs, hence the fallbacks.
      DISTRIBUTION: ${{ github.event.inputs.distribution || 'firebase' }}
      # A dispatch boolean arrives as the string "true"/"false"; the `if:`s compare to that.
      PUBLISH_TO_PLAY: ${{ github.event.inputs.publish_to_play || 'false' }}
    steps:
      # Actions are pinned to SHAs: a retagged action would run with the signing
      # keystore and Play/Firebase credentials in reach. Resolve a tag with
      #   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha
      # (deref again via git/tags/<sha> when that returns type "tag").
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # PR head, not the merge ref, so the changelog lists the branch's own commits.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          submodules: recursive
          lfs: true
          # Full history for the changelog's `git merge-base origin/main HEAD`.
          fetch-depth: 0

      - name: Validate publish inputs
        # Fail before the ~10 minute native build and the keystore decode.
        if: env.PUBLISH_TO_PLAY == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ "${DISTRIBUTION}" = "firebase" ]; then
            echo "::error::publish_to_play needs a bundle to publish; set distribution to 'play' or 'both'." >&2
            exit 1
          fi
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not set. Add the Play Console service-account JSON key with 'gh secret set GOOGLE_PLAY_SERVICE_ACCOUNT_JSON --env firebase-distribution' (see this file's header for the required role and the one-time manual bootstrap)." >&2
            exit 1
          fi
          echo "Publishing to the Play internal testing track is enabled for this run."

      - name: Resolve build identity
        # Play rejects any versionCode at or below the highest it has accepted, and
        # GitHub restarts the run number at 1 when this file is renamed or re-created.
        # ==> IF THE RUN NUMBER EVER RESTARTS, RAISE PIPETTE_VERSION_CODE_BASE BY
        #     PIPETTE_VERSION_CODE_GENERATION BEFORE THE NEXT RELEASE BUILD. <==
        # Raising BASE is always safe; lowering it never is.
        # RE-RUNNING a run reuses its run number, so Play rejects the publish: re-dispatch instead.
        env:
          PIPETTE_VERSION_CODE_BASE: "10000"
          PIPETTE_VERSION_CODE_GENERATION: "10000"
        run: |
          set -euo pipefail
          code=$(( PIPETTE_VERSION_CODE_BASE + GITHUB_RUN_NUMBER ))
          if [ "${GITHUB_RUN_NUMBER}" -ge "${PIPETTE_VERSION_CODE_GENERATION}" ]; then
            echo "::error::Run number ${GITHUB_RUN_NUMBER} has reached the generation size ${PIPETTE_VERSION_CODE_GENERATION}; raise PIPETTE_VERSION_CODE_BASE and the generation size together." >&2
            exit 1
          fi
          if [ "${code}" -le 0 ] || [ "${code}" -gt 2100000000 ]; then
            echo "::error::Computed versionCode ${code} is outside Play's accepted range (1..2100000000)." >&2
            exit 1
          fi
          # The commit, not the counter, identifies a build in the warehouse
          # (`client_version`), so a run-number reset can't make it ambiguous.
          tag="g$(git rev-parse --short=7 HEAD)"
          echo "PIPETTE_VERSION_CODE=${code}" >> "${GITHUB_ENV}"
          echo "PIPETTE_BUILD_TAG=${tag}" >> "${GITHUB_ENV}"
          echo "versionCode ${code} (base ${PIPETTE_VERSION_CODE_BASE} + run ${GITHUB_RUN_NUMBER}), build tag ${tag}"

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      # 'basic' keeps the cache on the Actions cache API, not the action's commercial
      # default; the encryption key lets the configuration cache persist across runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          cache-provider: basic
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up Android SDK
        # platform-tools alone: the action's default `tools platform-tools`
        # drags in the Android Emulator, which this job never boots.
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android NDK + native build tools
        run: |
          yes | sdkmanager --install "ndk;27.2.12479018" >/dev/null
          # Install before refreshing: an unconditional `apt-get update` can hang for
          # half an hour when a package mirror stops answering.
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10)
          sudo timeout 300 apt-get "${apt_opts[@]}" install -y --no-install-recommends ninja-build cmake || {
            sudo timeout 300 apt-get "${apt_opts[@]}" update
            sudo timeout 300 apt-get "${apt_opts[@]}" install -y --no-install-recommends ninja-build cmake
          }

      - name: Install Rust (Android target)
        # Pinning the `stable` branch's commit still installs current stable Rust;
        # only the action is frozen.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          # Shared with CI's android-app so llama.cpp/ggml isn't rebuilt from cold.
          key: android-app-v1
          cache-bin: false

      - name: Licenses (shipping dependencies)
        # Repeated from CI: a release can be dispatched from a ref whose path-filtered
        # android-app job never ran. Kept before the keystore decode so a license
        # regression aborts before touching signing material. See docs/licensing.md.
        run: |
          ./ci/android-licenses.py --selftest
          ./ci/android-licenses.py

      - name: Attribution file up to date
        # Regenerate with `./ci/android-attribution.py --write` and commit.
        run: ./ci/android-attribution.py --check

      - name: Install Sentry CLI
        # Used by :app:uploadBenchmarkNativeSymbols, a finalizer of assembleRelease and bundleRelease.
        # Pinned release + SHA-256, not `curl | bash`: this job holds SENTRY_AUTH_TOKEN.
        # Bump both vars together; digest from `gh api repos/getsentry/sentry-cli/releases/tags/<v>`.
        env:
          SENTRY_CLI_VERSION: "3.6.0"
          SENTRY_CLI_SHA256: "e2bff5d8b546f3fb72c616da656ecb347c7c144f36a5294b0749dcc2001f68d5"
        run: |
          set -euo pipefail
          url="https://github.com/getsentry/sentry-cli/releases/download/${SENTRY_CLI_VERSION}/sentry-cli-Linux-x86_64"
          curl -fsSL "$url" -o /tmp/sentry-cli
          echo "${SENTRY_CLI_SHA256}  /tmp/sentry-cli" | sha256sum -c -
          sudo install -m 0755 /tmp/sentry-cli /usr/local/bin/sentry-cli
          sentry-cli --version

      - name: Decode release keystore
        # Written to $RUNNER_TEMP, outside the checkout, so no glob or commit can pick
        # it up; a later step shreds it.
        env:
          # Via env:, never inlined, so secrets can't land in the logged command line.
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_BASE64}" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is empty, so the release build cannot be signed." >&2
            exit 1
          fi
          keystore="${RUNNER_TEMP}/pipette-release.jks"
          # tr strips whitespace a paste may add; base64's alphabet has none.
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 --decode > "${keystore}"
          # Scoped to the signing alias so the fingerprint is the key gradle signs with,
          # not the first entry; passed on via $GITHUB_ENV so nothing drifts on key rotation.
          details="$(keytool -list -v -keystore "${keystore}" -alias "${RELEASE_KEY_ALIAS}" -storepass "${RELEASE_KEYSTORE_PASSWORD}")"
          fingerprint="$(printf '%s\n' "${details}" | awk -F'SHA256: ' '/SHA256:/{print $2; exit}' | tr -d ': ' | tr 'A-F' 'a-f')"
          if [ -z "${fingerprint}" ]; then
            echo "::error::Could not read the signing-certificate SHA-256 from the keystore." >&2
            exit 1
          fi
          echo "UPLOAD_CERT_SHA256=${fingerprint}" >> "${GITHUB_ENV}"
          echo "Release keystore decoded and verified (upload cert SHA-256 ${fingerprint})."

      - name: Verify the Clerk key is present
        # Gradle only warns on a missing key (right for forks); a distributed build would
        # ship with the sign-in gate open. The key is public, hence the length echo.
        # Mirrors ClerkConfiguration.isCompleteKey: a prefix check alone passes
        # `pk_$(CLERK_PUBLISHABLE_KEY)`, which the runtime treats as no key.
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CLERK_PUBLISHABLE_KEY}" ]; then
            echo "::error::CLERK_PUBLISHABLE_KEY is empty, so this build would ship with sign-in disabled. Set the repository secret."
            exit 1
          fi
          # Single-quoted patterns: these are literal '$(' and '${' to match, not expansions.
          case "${CLERK_PUBLISHABLE_KEY}" in
            *'$('*|*'${'*)
              echo "::error::CLERK_PUBLISHABLE_KEY still contains an unexpanded placeholder, so the runtime would treat it as no key at all and ship with sign-in disabled."
              exit 1
              ;;
          esac
          case "${CLERK_PUBLISHABLE_KEY}" in
            pk_*) echo "Clerk key present (${#CLERK_PUBLISHABLE_KEY} chars)." ;;
            *) echo "::error::CLERK_PUBLISHABLE_KEY does not start with 'pk_'; the secret looks mangled."; exit 1 ;;
          esac

      - name: Build release artifacts
        # One gradle invocation shares configuration and the native build, and runs
        # the symbol-upload finalizer once instead of once per task.
        working-directory: android/Pipette
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          # Required: with PIPETTE_VERSION_CODE set, verifyReleaseSentryDsn fails the
          # build without it. For a telemetry-free release set PIPETTE_ENABLE_CRASH_REPORTING=0.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          # All four must be set or gradle silently falls back to the debug keystore.
          # Note the secret RELEASE_KEYSTORE_PASSWORD is gradle's RELEASE_STORE_PASSWORD.
          RELEASE_STORE_FILE: ${{ runner.temp }}/pipette-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # Sentry uploads are token-gated, so PR CI (no token) uploads nothing.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          PIPETTE_VERSION_CODE: ${{ env.PIPETTE_VERSION_CODE }}
          PIPETTE_BUILD_TAG: ${{ env.PIPETTE_BUILD_TAG }}
        run: |
          set -euo pipefail
          # The two tests are mutually exclusive, so the task list is never empty.
          tasks=()
          if [ "${DISTRIBUTION}" != "play" ]; then tasks+=(:app:assembleKotlinEngineRelease); fi
          if [ "${DISTRIBUTION}" != "firebase" ]; then tasks+=(:app:bundleKotlinEngineRelease); fi
          echo "distribution=${DISTRIBUTION} -> gradle tasks: ${tasks[*]}"
          ./gradlew "${tasks[@]}" --no-daemon --stacktrace

      - name: Verify computed native libs 16 KB page-size compatibility
        working-directory: android/Pipette
        run: ../../ci/android-16kb-page-size.sh app/build/generated/kotlinJniLibs

      - name: Verify APK 16 KB page-size compatibility
        if: env.DISTRIBUTION != 'play'
        working-directory: android/Pipette
        run: ../../ci/android-16kb-page-size.sh app/build/outputs/apk/kotlinEngine/release/app-kotlinEngine-release.apk

      - name: Verify AAB 16 KB page-size compatibility
        if: env.DISTRIBUTION != 'firebase'
        working-directory: android/Pipette
        run: ../../ci/android-16kb-page-size.sh app/build/outputs/bundle/kotlinEngineRelease/app-kotlinEngine-release.aab

      - name: Verify release signature
        # Catches gradle's silent fallback to the debug keystore when any RELEASE_* is blank.
        if: env.DISTRIBUTION != 'play'
        working-directory: android/Pipette
        run: |
          set -euo pipefail
          expected="${UPLOAD_CERT_SHA256:-}"
          if [ -z "${expected}" ]; then
            echo "::error::UPLOAD_CERT_SHA256 was not set by the decode step." >&2
            exit 1
          fi
          # `tail`, not `head`: it drains the pipe, so no SIGPIPE under pipefail.
          apksigner="$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -1)"
          if [ ! -x "${apksigner}" ]; then
            echo "::error::apksigner not found under ${ANDROID_HOME}/build-tools." >&2
            exit 1
          fi
          # Exactly one, so the verified file is the shipped one. `|| true` lets a
          # missing directory reach the check below as "none".
          apks="$(find app/build/outputs/apk/kotlinEngine/release -name '*.apk' 2>/dev/null || true)"
          if [ "$(printf '%s\n' "${apks}" | grep -c .)" -ne 1 ]; then
            echo "::error::Expected exactly one release APK under app/build/outputs/apk/kotlinEngine/release; found: ${apks:-none}" >&2
            exit 1
          fi
          echo "Verifying ${apks} with ${apksigner}"
          certs="$("${apksigner}" verify --print-certs "${apks}")"
          echo "${certs}"
          apk_cert="$(printf '%s\n' "${certs}" | awk -F'digest: ' '/SHA-256 digest:/{print $2; exit}' | tr -d ' ' | tr 'A-F' 'a-f')"
          if [ "${apk_cert}" != "${expected}" ]; then
            echo "::error::Release APK cert (${apk_cert:-none}) != production upload key (${expected}). Gradle likely fell back to the debug keystore." >&2
            exit 1
          fi
          echo "Signature matches the production upload key (${expected})."

      - name: Verify AAB signature
        # A debug-signed first upload would need a Google key reset. A bundle is
        # JAR-signed, so apksigner can't check it, and neither check suffices alone:
        # `jarsigner -verify` passes an unsigned jar; `keytool -printcert` checks no digests.
        # No `-strict`: upload keys are self-signed, so PKIX validation always fails.
        if: env.DISTRIBUTION != 'firebase'
        working-directory: android/Pipette
        run: |
          set -euo pipefail
          expected="${UPLOAD_CERT_SHA256:-}"
          if [ -z "${expected}" ]; then
            echo "::error::UPLOAD_CERT_SHA256 was not set by the decode step." >&2
            exit 1
          fi
          aabs="$(find app/build/outputs/bundle/kotlinEngineRelease -name '*.aab' 2>/dev/null || true)"
          if [ "$(printf '%s\n' "${aabs}" | grep -c .)" -ne 1 ]; then
            echo "::error::Expected exactly one release AAB under app/build/outputs/bundle/kotlinEngineRelease; found: ${aabs:-none}" >&2
            exit 1
          fi
          echo "Verifying ${aabs}"
          # Inside `if ! cmd; then`, `$?` is the negation's (always 0), not jarsigner's.
          jarsigner_status=0
          jarsigner -verify "${aabs}" || jarsigner_status=$?
          if [ "${jarsigner_status}" -ne 0 ]; then
            echo "::error::jarsigner -verify failed for ${aabs} (exit ${jarsigner_status}): a signed entry no longer matches its recorded digest, or jarsigner is unavailable." >&2
            exit 1
          fi
          # keytool fails on a corrupt bundle and exits 0 on an unsigned one; either
          # way the fingerprint parses empty and the comparison rejects it.
          certs="$(keytool -printcert -jarfile "${aabs}" 2>&1 || true)"
          aab_cert="$(printf '%s\n' "${certs}" | awk -F'SHA256: ' '/SHA256:/{print $2; exit}' | tr -d ': ' | tr 'A-F' 'a-f')"
          if [ "${aab_cert}" != "${expected}" ]; then
            echo "::error::Release AAB cert (${aab_cert:-none, bundle unsigned?}) != production upload key (${expected}); gradle likely fell back to the debug keystore." >&2
            exit 1
          fi
          echo "AAB signature matches the production upload key (${expected})."
          # Repo-relative: later steps run from the repo root.
          echo "PLAY_AAB_PATH=android/Pipette/${aabs}" >> "${GITHUB_ENV}"

      - name: Shred signing material
        # Don't rely on runner ephemerality: this job uses a custom runner label.
        if: always()
        run: rm -f "${RUNNER_TEMP}/pipette-release.jks"

      - name: Attach Play bundle to this run
        # Needs no signing material, so it deliberately sits after the shred step.
        if: env.DISTRIBUTION != 'firebase'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # upload-artifact rejects a duplicate name within a run, so a re-run needs run_attempt.
          name: pipette-play-bundle-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ env.PLAY_AAB_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Write Play release notes
        # The file must be `whatsnew-<locale>` for a locale the listing has. Google
        # truncates at 500 characters, so stop at 450 on a whole commit line.
        if: env.PUBLISH_TO_PLAY == 'true'
        run: |
          set -euo pipefail
          notes=""
          # `|| true`: empty notes fall back to the generic line below.
          git fetch --no-tags --quiet origin main || true
          base="$(git merge-base origin/main HEAD 2>/dev/null || true)"
          if [ -n "${base}" ]; then
            subjects="$(git log --no-merges --pretty=%s "${base}..HEAD" || true)"
            while IFS= read -r line; do
              [ -z "${line}" ] && continue
              next="${notes}- ${line}"$'\n'
              [ "${#next}" -gt 450 ] && break
              notes="${next}"
            done <<< "${subjects}"
          fi
          [ -z "${notes}" ] && notes="- Internal build ${GITHUB_RUN_NUMBER}."$'\n'
          mkdir -p .whatsnew
          printf '%s' "${notes}" > .whatsnew/whatsnew-en-US
          echo "Release notes ($(wc -c < .whatsnew/whatsnew-en-US) bytes):"
          cat .whatsnew/whatsnew-en-US

      - name: Publish to Play internal testing track
        if: env.PUBLISH_TO_PLAY == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5  # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ai.liquid.pipette
          # The exact file the signature check verified, not a re-glob.
          releaseFiles: ${{ env.PLAY_AAB_PATH }}
          track: internal
          releaseName: "1.0+${{ env.PIPETTE_BUILD_TAG }} (${{ env.PIPETTE_VERSION_CODE }})"
          whatsNewDirectory: .whatsnew
          # The internal track has no staged rollout.
          status: completed

      - name: Summarize Play bundle
        if: env.DISTRIBUTION != 'firebase'
        run: |
          set -euo pipefail
          {
            echo "## Pipette Android: Play release bundle"
            echo ""
            echo "- **Artifact:** \`pipette-play-bundle-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}\`, downloadable from this run's Artifacts section (GitHub wraps it in a .zip)"
            echo "- **File:** \`$(basename "${PLAY_AAB_PATH}")\` ($(du -h "${PLAY_AAB_PATH}" | cut -f1))"
            echo "- **versionCode:** ${PIPETTE_VERSION_CODE} (base + run ${GITHUB_RUN_NUMBER})"
            echo "- **versionName:** 1.0+${PIPETTE_BUILD_TAG}"
            echo "- **Upload cert SHA-256:** \`${UPLOAD_CERT_SHA256}\`"
            echo ""
            if [ "${PUBLISH_TO_PLAY}" = "true" ]; then
              echo "Published to the **internal testing** track. Review at Play Console → Testing → Internal testing."
              echo ""
              echo "The artifact above is still attached, so a rejected or half-finished publish can be uploaded by hand without rebuilding."
            else
              echo "Upload at Play Console → Testing → Internal testing → Create new release, or re-dispatch with \`publish_to_play\` to push it from CI."
            fi
            echo ""
            echo "The first upload permanently claims the \`ai.liquid.pipette\` package name and registers the certificate above as the account's UPLOAD key:"
            echo "the key every future upload must be signed with. Play generates a separate app signing key for what end-user devices verify."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Generate release notes (commits since main)
        if: env.DISTRIBUTION != 'play'
        run: |
          set -euo pipefail
          SHORT="$(git rev-parse --short HEAD)"
          {
            echo "Pipette Android (${SHORT})"
            echo ""
            if [ -n "${NOTES_OVERRIDE}" ]; then
              echo "${NOTES_OVERRIDE}"
            else
              git fetch --no-tags --quiet origin main || true
              if BASE="$(git merge-base origin/main HEAD 2>/dev/null)" && [ -n "${BASE}" ]; then
                CHANGES="$(git log --no-merges --pretty='- %s' "${BASE}..HEAD")"
                if [ -n "${CHANGES}" ]; then
                  echo "${CHANGES}"
                else
                  echo "- No commits since main (HEAD is up to date with main)."
                fi
              else
                # Can't resolve a base (e.g. main itself), so fall back to the tip.
                git log -1 --pretty='- %s'
              fi
            fi
            # App Distribution's "Contact:" shows the service account, not a real mailbox.
            echo ""
            echo "Questions or feedback? Contact david.berrios@liquid.ai"
          } | tee release-notes.txt
        env:
          NOTES_OVERRIDE: ${{ github.event.inputs.notes }}

      - name: Upload to Firebase App Distribution
        if: env.DISTRIBUTION != 'play'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Release Firebase Android app (ai.liquid.pipette) in project liquid-leap.
          FIREBASE_APP_ID: "1:32876689405:android:43166060d1d78a45a00b94"
          GROUPS: ${{ github.event.inputs.groups || vars.FIREBASE_TESTER_GROUPS }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set. Add a service-account JSON key with the 'Firebase App Distribution Admin' role with 'gh secret set FIREBASE_SERVICE_ACCOUNT --env firebase-distribution'."
            exit 1
          fi
          printf '%s' "${FIREBASE_SERVICE_ACCOUNT}" > "${RUNNER_TEMP}/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="${RUNNER_TEMP}/firebase-sa.json"

          APK="$(ls android/Pipette/app/build/outputs/apk/kotlinEngine/release/*.apk 2>/dev/null | head -1)"
          if [ -z "${APK}" ] || [ ! -f "${APK}" ]; then
            echo "::error::No release APK under android/Pipette/app/build/outputs/apk/kotlinEngine/release/. Did ':app:assembleKotlinEngineRelease' produce one?"
            exit 1
          fi
          echo "Distributing: ${APK}"
          echo "Groups: ${GROUPS:-<none: uploaded without notifying a group>}"

          GROUP_ARGS=()
          if [ -n "${GROUPS:-}" ]; then
            GROUP_ARGS=(--groups "${GROUPS}")
          fi

          npx -y firebase-tools@15.21.0 appdistribution:distribute "${APK}" \
            --app "${FIREBASE_APP_ID}" \
            --release-notes-file release-notes.txt \
            "${GROUP_ARGS[@]}"

          {
            echo "## Pipette Android: distributed to Firebase App Distribution"
            echo ""
            echo "- **APK:** \`$(basename "${APK}")\` ($(du -h "${APK}" | cut -f1))"
            echo "- **App ID:** \`${FIREBASE_APP_ID}\`"
            echo "- **Groups:** ${GROUPS:-_none (assign testers in the console)_}"
            echo ""
            echo "### Release notes"
            echo '```'
            cat release-notes.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
