name: Bug report
description: Report something that is broken or behaving unexpectedly.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include secrets, tokens, private keys, or proprietary model data.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the bug and the behavior you expected.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How do we reproduce it?
      description: Include commands, device/OS, runtime, model format, and relevant logs.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, device, Rust/Xcode/Android versions, Pipette command, or app build.
    validations:
      required: false
